<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="theme-color" content="#04050a"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sync MM2</title><script>try{var M=localStorage.mode==="ps99"?"ps99":"mm2";document.documentElement.dataset.mode=M;if(M==="ps99")document.title="Sync PS99"}catch(e){}</script><link rel="icon" id="fav" type="image/png" href="/logo.png"><script>if(document.documentElement.dataset.mode==="ps99")document.getElementById("fav").href="/logo-ps99.png"</script><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Syncopate:wght@700&display=swap" rel="stylesheet">
<style>
:root{--logo:url(/logo.png);--ac1b:#5b49e0;--glow:#8f7cff66;--glow2:#8f7cff88;--glow3:#8f7cff2e;--bg:#04050a;--bg2:#080a10;--p:#0d1018;--p2:#141824;--p3:#1c2232;--a:#c9cedb;--ac1:#8f7cff;--ac2:#d6dcff;--t:#eef1f7;--m:#8b92a5;--g:#5ee6a0;--r:#ff6b7a;--ln:#ffffff17;--sh:0 18px 44px -20px #000}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--t);font:14px/1.5 'Sora',system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:var(--t);background:var(--p2);border:1px solid var(--ln);border-radius:12px;padding:10px 13px;outline:none}
input:focus,select:focus{border-color:var(--ac1);box-shadow:0 0 0 3px var(--glow3)}
button{cursor:pointer;background:linear-gradient(135deg,var(--ac1),var(--ac1b));color:#fff;border:0;font-weight:700;letter-spacing:.2px;transition:transform .12s ease,box-shadow .2s ease,opacity .2s ease;box-shadow:0 4px 14px -4px var(--glow)}
button:hover:not(:disabled){box-shadow:0 6px 18px -4px var(--glow2);transform:translateY(-1px)}
button:active:not(:disabled){transform:scale(.96) translateY(0)}button:disabled{opacity:.4;cursor:default;box-shadow:none}
button.s{background:var(--p2);color:var(--t);border:1px solid var(--ln);box-shadow:none}button.s:hover:not(:disabled){border-color:var(--a);box-shadow:none;background:var(--p3)}
input[type=range]{accent-color:var(--ac1);padding:0}
#sb{position:fixed;left:0;top:0;bottom:0;width:230px;background:linear-gradient(180deg,var(--p) 0%,var(--bg2) 100%);border-right:1px solid var(--ln);padding:14px 10px;z-index:20;transform:translateX(-100%);transition:transform .3s cubic-bezier(.2,.8,.2,1);overflow-y:auto}
#sb.open{transform:none}#ov{display:none;position:fixed;inset:0;background:#000a;backdrop-filter:blur(2px);z-index:15;animation:fade .2s both}#ov.show{display:block}
.logo{font-weight:800;font-size:20px;background:linear-gradient(135deg,var(--ac1),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent;padding:4px 8px 14px;letter-spacing:.3px}
.uc{display:flex;gap:10px;align-items:center;background:var(--p2);border:1px solid var(--ln);border-radius:14px;padding:10px;margin-bottom:12px}.uc b{display:block;word-break:break-all}
#nv button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:none;color:var(--m);padding:11px 12px;border-radius:10px;margin-bottom:2px;border:0;font-weight:600;box-shadow:none;position:relative}
#nv button:hover{background:var(--p2);color:var(--t);transform:none;box-shadow:none}
#nv button.on{background:linear-gradient(90deg,var(--glow3),transparent);color:var(--t)}
#nv button.on::before{content:'';position:absolute;left:-10px;top:8px;bottom:8px;width:3px;border-radius:3px;background:linear-gradient(180deg,var(--ac1),var(--ac2))}
.top{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#15171ccc;backdrop-filter:blur(10px);position:sticky;top:0;z-index:5;border-bottom:1px solid var(--ln)}.top b{flex:1;font-size:16px}
main{padding:14px;max-width:960px;margin:auto}
@media(min-width:860px){#sb{transform:none}#mn{margin-left:230px}.top .mb{display:none}#ov{display:none!important}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.card{background:linear-gradient(180deg,var(--p2),var(--p));border:1px solid var(--ln);border-radius:14px;padding:10px;text-align:center;cursor:pointer;transition:transform .18s cubic-bezier(.2,.8,.2,1),border-color .18s,box-shadow .18s;animation:up .35s cubic-bezier(.2,.8,.2,1) both}
.card:hover{transform:translateY(-4px);border-color:#4a4f5e;box-shadow:var(--sh)}
.card.sel{border-color:var(--g);box-shadow:0 0 0 1px var(--g),0 0 16px -4px #4ade8077}
.ic{height:64px;display:flex;align-items:center;justify-content:center;font-size:42px;filter:drop-shadow(0 4px 8px #0006)}.ic img{max-height:64px;max-width:100%;object-fit:contain}
.card b{display:block;font-size:12px;margin:4px 0}.card small{color:var(--g)}.muted{color:var(--m)}.tok{color:#fbbf24;font-weight:700}
.box{background:linear-gradient(180deg,#1c1f26,#15171c);border:1px solid var(--ln);border-radius:16px;padding:16px;margin-bottom:14px;animation:up .35s cubic-bezier(.2,.8,.2,1) both;box-shadow:var(--sh)}h3{margin:0 0 12px;letter-spacing:.2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}.lb{display:block;color:var(--m);margin:14px 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.8px}
.stat{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--ln)}.stat:last-child{border-bottom:0}.g{color:var(--g)}

.mw{display:grid;grid-template-columns:1fr;gap:14px}@media(min-width:760px){.mw{grid-template-columns:300px 1fr}}
/* mines */
.mstage{background:radial-gradient(500px 300px at 50% 0%,#241d4a55,transparent 70%),linear-gradient(180deg,#171a22,#101218);border:1px solid #2c3140;border-radius:18px;padding:16px;box-shadow:var(--sh)}
.mchips{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}.mchip{background:#0d0f14;border:1px solid #2a2f3d;border-radius:12px;padding:8px 6px;text-align:center}

.mt{aspect-ratio:1;border-radius:14px;border:1px solid #444d63;background:linear-gradient(160deg,#363f55,#252b3b);box-shadow:inset 0 1px 0 #ffffff26,inset 0 -3px 0 #0003,0 6px 14px -6px #000c;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;transition:transform .12s,border-color .15s,box-shadow .15s}
.mt:not(:disabled):hover{transform:translateY(-3px);border-color:#9b8cff;box-shadow:inset 0 1px 0 #ffffff33,0 10px 22px -8px var(--glow2);background:linear-gradient(160deg,#414b66,#2b3347)}
.mt:disabled{cursor:default;opacity:1}.mt svg{width:56%;height:56%}
.mt.gem{background:linear-gradient(160deg,#25a05c,#125a34);border-color:#6df0a2;box-shadow:0 0 20px -4px #4ade80aa,inset 0 1px 0 #ffffff44;animation:flip .45s cubic-bezier(.2,.8,.2,1)}
.mt.bomb{background:linear-gradient(160deg,#9b2a38,#4d121b);border-color:#ff8a8a;box-shadow:0 0 20px -4px #f87171aa;animation:flip .45s cubic-bezier(.2,.8,.2,1)}
.mt.bomb.dim{opacity:.55;box-shadow:none;animation:none}.mt.hit{animation:shake .5s,flip .45s}
.mgrid.pls .mt{animation:pulse .6s infinite alternate ease-in-out}
.mres{text-align:center;font:700 16px/1.3 'Syncopate',system-ui,sans-serif;letter-spacing:.1em;margin:14px 0 0;padding:12px;border-radius:12px}.mres.win{background:#4ade8018;color:var(--g);border:1px solid #4ade8055}.mres.lose{background:#f8717118;color:var(--r);border:1px solid #f8717155}
.mres small{display:block;font:500 13px system-ui,sans-serif;letter-spacing:0;color:var(--m);margin-top:4px}
.mctl .row button.on{outline:2px solid var(--ac2)}.mctl input[type=number]{text-align:center}
.cashbtn{background:linear-gradient(135deg,#22c55e,#15803d)!important;box-shadow:0 8px 22px -6px #22c55e99!important}
.ld{display:flex;flex-direction:column;align-items:center;gap:14px;padding:90px 0}
.sp{width:40px;height:40px;border:3px solid var(--p2);border-top-color:var(--ac1);border-right-color:var(--ac2);border-radius:50%;animation:rot .7s cubic-bezier(.5,.2,.5,.8) infinite}
@keyframes rot{to{transform:rotate(360deg)}}
@keyframes up{from{opacity:0;transform:translateY(12px) scale(.98)}}
@keyframes fade{from{opacity:0}}
@keyframes flip{from{transform:rotateY(90deg) scale(.6);opacity:.3}}

@keyframes pulse{to{background:#2c3036;transform:scale(.9)}}

#wheel{width:240px;height:240px;border-radius:50%;margin:10px auto;border:5px solid var(--p2);box-shadow:0 0 0 1px var(--ln),var(--sh)}

table{width:100%;border-collapse:collapse}td,th{padding:8px 7px;text-align:left;border-bottom:1px solid var(--ln)}.av{width:28px;height:28px;border-radius:50%;vertical-align:middle;margin-right:6px;background:var(--p3)}
.noanim *{animation:none!important;transition:none!important}
#chatbtn{position:fixed;right:18px;bottom:18px;width:54px;height:54px;border-radius:50%;font-size:22px;z-index:50;box-shadow:0 8px 24px -4px var(--glow2);display:flex;align-items:center;justify-content:center;padding:0;background:linear-gradient(135deg,var(--ac1),var(--ac1b))}

.logo{display:flex;align-items:center;gap:10px;-webkit-background-clip:initial;background:none;color:var(--t)}
.logo img{width:28px;height:28px;object-fit:contain;filter:drop-shadow(0 0 8px var(--glow2))}

.cfg{display:flex;flex-wrap:wrap;gap:12px;align-items:center;background:linear-gradient(180deg,var(--p2),var(--p));border:1px solid var(--ln);border-radius:14px;padding:12px;margin-bottom:10px;animation:up .35s both}
.cfg .pl{display:flex;align-items:center;gap:8px;min-width:130px}.cfg .its{display:flex;gap:4px;flex:1;flex-wrap:wrap}.cfg .its .ic{height:38px;width:38px;font-size:24px}.cfg .its .ic img,.cfg .its .ic svg{max-height:38px;width:38px;height:38px}
.side{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700;background:#7c6cf033;color:#c9c2ff}.side.tails{background:#4fd1ff22;color:#8fe3ff}
.sd{display:flex;gap:8px}.sd button{flex:1}.sd button.on{outline:2px solid var(--ac2)}

.coin .t{transform:rotateY(180deg);background:radial-gradient(circle at 30% 28%,#ff8a8a,#e0262d 60%,#85101a);border:4px solid #ffd0d0;box-shadow:0 0 26px #ff4a4a99,inset 0 0 14px #66080e88;text-shadow:0 2px 6px #66080e}
.cflogo{width:84px;height:84px;object-fit:contain;filter:drop-shadow(0 0 18px var(--glow2))}
.tally{font:700 14px 'Syncopate',system-ui,sans-serif;letter-spacing:.2em;color:var(--m);min-height:18px}.tally b{color:#fff}
.cfres{opacity:0;transform:scale(.7);transition:opacity .4s,transform .4s cubic-bezier(.2,.8,.2,1);text-align:center}.cfres.show{opacity:1;transform:none}
.cfres .big{font:700 38px/1.1 'Syncopate',system-ui,sans-serif;letter-spacing:.14em;text-indent:.14em}.cfres.win .big{color:#4ade80;text-shadow:0 0 28px #4ade8099}.cfres.lose .big{color:#f87171;text-shadow:0 0 28px #f8717199}
.cfres small{display:block;margin-top:8px;color:var(--m);font-size:14px}
.sd button.hd{border-color:#2f8cff66}.sd button.tl{border-color:#ff4a4a66}
@keyframes cflip{0%{transform:translateY(0) rotateY(0)}45%{transform:translateY(var(--up)) rotateY(calc(var(--rf)*.55))}100%{transform:translateY(0) rotateY(var(--rf))}}
#cfov h2{margin:0;font:700 18px 'Syncopate',system-ui,sans-serif;letter-spacing:.2em;text-indent:.2em;text-align:center}
#rainbox{padding:10px 12px;border-bottom:1px solid var(--ln);background:linear-gradient(135deg,#142238,#17122e);font-size:13px}
#rainbox .rt{font-weight:700;display:flex;justify-content:space-between;gap:8px;align-items:center}#rainbox .rs{color:var(--m);font-size:12px;margin-top:3px}

#rainbox .rq{display:flex;gap:6px;align-items:center;margin-top:8px}#rainbox .rq b{font-size:16px;white-space:nowrap}#rainbox .rq input{flex:1;min-width:0;padding:7px 9px}#rainbox .rq button,#rainbox>button{padding:7px 12px}
#rainbox>button{margin-top:8px;width:100%}
.cmsg.sys{background:#4fd1ff14;border:1px solid #4fd1ff33;border-radius:10px;padding:6px 8px;color:#bfe9ff}
#chatmsgs{min-height:120px}
#rainov{position:fixed;inset:0;z-index:950;background:#05060acc;backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:16px;animation:fade .2s both}

#rainov .rtt{font:700 16px 'Syncopate',system-ui,sans-serif;letter-spacing:.18em}#rainov .rmuted{color:var(--m);font-size:13px}
#rainov .rbig{font:700 36px/1.1 'Syncopate',system-ui,sans-serif}#rainov input{text-align:center;font-size:18px}

.sdc:hover:not(:disabled){transform:none;box-shadow:none;background:#181b23}.sdc small{display:block;color:var(--m);font-weight:500}

let MODE=localStorage.mode==='ps99'?'ps99':'mm2',ITEMSC=[],ITEMSIV='';
const PS=()=>MODE==='ps99';
const abbr=n=>{n=Math.floor(n);const a=Math.abs(n);if(a>=1e12)return +(n/1e12).toFixed(2)+'T';if(a>=1e9)return +(n/1e9).toFixed(2)+'B';if(a>=1e6)return +(n/1e6).toFixed(2)+'M';if(a>=1e4)return +(n/1e3).toFixed(1)+'K';return n.toLocaleString()};
const fmt=n=>PS()?abbr(n):Math.floor(n).toLocaleString();
const LG=()=>PS()?'/logo-ps99.png':'/logo.png',BRAND=()=>PS()?'Sync PS99':'Sync MM2',CN=()=>PS()?'gems':'tokens',MINB=()=>PS()?1000000:5;
const GEMSVG='<svg class="gi" viewBox="0 0 24 24"><defs><linearGradient id="gmg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d9fbff"/><stop offset=".5" stop-color="#4fd1ff"/><stop offset="1" stop-color="#1f7ae0"/></linearGradient></defs><path d="M6 3h12l4 6-10 12L2 9z" fill="url(#gmg)" stroke="#bff3ff" stroke-width="1" stroke-linejoin="round"/><path d="M2 9h20M9 3 7 9l5 12 5-12-2-6" fill="none" stroke="#e9fdff" stroke-opacity=".7" stroke-width=".9" stroke-linejoin="round"/></svg>';
const CI=()=>PS()?GEMSVG:'🪙';
const msw=()=>`<div class="msw"><button class="mm ${PS()?'':'on'}" onclick="swMode('mm2')">MM2</button><i>||</i><button class="ps ${PS()?'on':''}" onclick="swMode('ps99')">PS99</button></div>`;
function swMode(m){if(m===MODE)return;localStorage.mode=m;location.reload()}
let S=null,tab='home',q='',sel={},mres=null,mlast=-1,seen=0,pend=null,nav=0,mbet=MODE==='ps99'?1000000:10,mmn=3,mbusy=false,cfg=JSON.parse(localStorage.cfg||'{"anim":true,"hide":false}');
let chatOpen=false,chatSeen=0;
const BETS=()=>PS()?[1e6,5e6,10e6,50e6,100e6,500e6]:[5,10,50,100,500,1000];
const ICO=k=>`<svg viewBox="0 0 24 24">${{"home": "<path d=\"M3 11.5 12 4l9 7.5\"/><path d=\"M5.5 10v9.5h13V10\"/><path d=\"M10 19.5v-5h4v5\"/>", "values": "<path d=\"M3 17l5-5 4 4 8-9\"/><path d=\"M15 7h5v5\"/>", "inv": "<path d=\"M3.5 7.5 12 3l8.5 4.5v9L12 21l-8.5-4.5z\"/><path d=\"M3.5 7.5 12 12l8.5-4.5M12 12v9\"/>", "ex": "<path d=\"M4 8h14l-3.5-3.5M20 16H6l3.5 3.5\"/>", "tip": "<rect x=\"3.5\" y=\"9\" width=\"17\" height=\"11\" rx=\"1.5\"/><path d=\"M12 9v11M3.5 13h17M12 9c-3.5 0-5-1-5-2.500S8.500 4 10 5c1 .7 2 4 2 4zm0 0c3.500 0 5-1 5-2.500S15.500 4 14 5c-1 .7-2 4-2 4z\"/>", "jp": "<circle cx=\"12\" cy=\"12\" r=\"9\"/><circle cx=\"12\" cy=\"12\" r=\"2.500\"/><path d=\"M12 3v6.500M12 14.500V21M3 12h6.500M14.500 12H21\"/>", "cf": "<circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M12 7v10M9.500 9.500c0-1 1-1.700 2.500-1.700s2.500.7 2.500 1.800-1 1.600-2.500 2-2.500.9-2.500 2 1 1.800 2.500 1.800 2.500-.8 2.500-1.800\"/>", "bj": "<rect x=\"5\" y=\"3\" width=\"14\" height=\"18\" rx=\"2.500\"/><path d=\"M12 7.500l3.500 4.500-3.500 4.500L8.500 12z\"/>", "mine": "<path d=\"M6 4h12l3.500 5L12 21 2.500 9z\"/><path d=\"M2.500 9h19M9 4 7.500 9 12 21l4.500-12L15 4\"/>", "tw": "<path d=\"M5 21V10h14v11M3 21h18M8 10V6h3v4M13 10V6h3v4M10 21v-5h4v5\"/>", "up": "<path d=\"M12 16V4M7 9l5-5 5 5M4 20h16\"/>", "down": "<path d=\"M12 4v12M7 11l5 5 5-5M4 20h16\"/>", "pl": "<circle cx=\"12\" cy=\"8\" r=\"3.500\"/><path d=\"M5 20c0-3.500 3-6 7-6s7 2.500 7 6\"/>", "lb": "<path d=\"M7 4h10v5a5 5 0 0 1-10 0zM7 6H4v1.500A3.500 3.500 0 0 0 7.500 11M17 6h3v1.500A3.500 3.500 0 0 1 16.500 11M12 14v4M8.500 20h7\"/>", "set": "<path d=\"M4 7h10M18 7h2M4 17h2M10 17h10\"/><circle cx=\"16\" cy=\"7\" r=\"2\"/><circle cx=\"8\" cy=\"17\" r=\"2\"/>", "adm": "<path d=\"M12 3l8 3v6c0 4.500-3.300 8-8 9-4.700-1-8-4.500-8-9V6z\"/>"}[k]}</svg>`;
const NAV=[['home','home','Home'],['values','values','Values'],['inventory','inv','Inventory'],['exchange','ex','Exchange'],['tip','tip','Tip'],['jackpot','jp','Jackpot'],['coinflip','cf','Coinflip'],['blackjack','bj','Blackjack'],['mines','mine','Mines'],['towers','tw','Towers',1],['withdraw','up','Withdraw'],['deposit','down','Deposit'],['leaderboard','lb','Leaderboard'],['players','pl','Players'],['settings','set','Settings'],['admin','adm','Admin']];
const toast=(m,ok)=>{const t=$('#toast');t.textContent=m;t.style.background=ok?'linear-gradient(135deg,#16a34a,#15803d)':'';t.style.display='block';clearTimeout(t._);t._=setTimeout(()=>t.style.display='none',2500)};
const api=async(a,b={})=>{try{const r=await fetch('/api/'+a,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({...b,gm:MODE})});const j=await r.json();if(j.error)toast(j.error);return j}catch{toast('Network error');return{}}};
// Splash: logo + title, then fades out. Used on site entry and when opening a game.
const GAMES=['mines','jackpot','coinflip','blackjack','towers'];
function splash(text,ms=1700){const old=$('#splash');if(old)old.remove();if(!cfg.anim)return;
 const d=document.createElement('div');d.id='splash';d.innerHTML=`<img src="${LG()}" alt=""><b>${text}</b><i></i>`;document.body.appendChild(d);setTimeout(()=>d.remove(),ms)}
{const s=document.querySelector('#splash');if(s){if(!cfg.anim)s.remove();else setTimeout(()=>s.remove(),1800)}}
const emojiSpan=e=>{const s=document.createElement('span');s.textContent=e;return s};
// Icon chain: /icons/<id>.png (your own file) -> MM2 wiki image by item name -> emoji
const wikiImg=n=>'https://murder-mystery-2.fandom.com/wiki/Special:FilePath/'+encodeURIComponent(n.replace(/ /g,'_'))+'.png';
const hh=s=>{let x=0;for(const c of s)x=(x*31+c.charCodeAt(0))%360;return x};
// Drawn icon (used when no PNG / wiki image loads): gun or knife silhouette coloured by rarity + item
function icSvg(d){const t=d.type,r=d.rar,id=d.id,H=hh(id),H2=(H+50)%360;
 if(t==='pet')return d.emoji?`<span>${d.emoji}</span>`:petTile(d);
 const g=r==='chroma'?['#ff4d6d','#ffd23f','#3ddc97','#4fb3ff','#b47cff']:r==='ancient'?['#fff1b8','#e9b949','#a66a12']:r==='unique'?['#ffb3b3','#e03a3a','#6b0f1a']:[`hsl(${H} 85% 72%)`,`hsl(${H} 75% 55%)`,`hsl(${H2} 70% 38%)`];
 const stops=g.map((c,i)=>`<stop offset="${i/(g.length-1)*100}%" stop-color="${c}"/>`).join('');
 const gl=r==='chroma'?'#ffffff88':r==='ancient'?'#e9b949aa':`hsl(${H} 90% 60% / .55)`;
 const nm=(id+' '+(d.name||'')).toLowerCase(),F=`fill="url(#g${id})" stroke="#0007" stroke-width="1.5" stroke-linejoin="round"`,HL='stroke="#fff8" stroke-width="1.6" stroke-linecap="round" fill="none"',DK='stroke="#2a2d36" stroke-linecap="round" fill="none"';
 const gv=/laser|blaster|ray|beam|virtual|pixel|bringer|cannon|alien|iceblaster|amerilaser|heat|flames|evergun|chill/.test(nm)?'blaster':/revolver|traveler|constellation|clockwork|oldglory/.test(nm)?'revolver':'pistol';
 const kv=/scythe|harvester/.test(nm)?'scythe':/axe|chopper/.test(nm)?'axe':/\bsaw\b|handsaw|chromasaw/.test(nm)?'saw':/cane|peppermint|candy/.test(nm)?'cane':/shard|gemstone|prismatic|iceshard|frost|snowflake|icebreaker|icepiercer|corrupt/.test(nm)?'shard':/wing/.test(nm)?'wing':'blade';
 const GUNS={
  pistol:`<path d="M6 21h40l6 4v8H31l-3 4h-5l1-4H15l-3 17H5l4-17H6z" ${F}/><rect x="8" y="23" width="30" height="3" rx="1.5" fill="#fff6"/><circle cx="42" cy="29" r="2" fill="#0006"/>`,
  revolver:`<path d="M6 20h38l8 5v7H32l-2 6h-6l1-6H16L13 54H6l4-22H6z" ${F}/><circle cx="30" cy="25" r="7" fill="#0005" stroke="#fff5" stroke-width="1.2"/><circle cx="30" cy="25" r="2.4" fill="#fff6"/><rect x="8" y="22" width="14" height="2.5" rx="1.2" fill="#fff6"/>`,
  blaster:`<path d="M4 22h30l6-6h10l4 4v6h6v8h-6v4H38l-4 4h-8l2-6H16l-4 16H5l4-16H4z" ${F}/><rect x="8" y="25" width="26" height="3" rx="1.5" fill="#fff6"/><circle cx="46" cy="26" r="3" fill="#fffa"/><path d="M50 14v4M54 16l-2 3" ${HL}/>`};
 const KNIVES={
  blade:`<path d="M26 36 61 5c-1 14-9 27-23 35z" ${F}/><path d="M30 35 56 9" ${HL}/><path d="M21 31l15 15" ${DK} stroke-width="5"/><path d="M26 41 8 59" stroke="url(#g${id})" stroke-width="7" stroke-linecap="round"/><path d="M26 41 8 59" stroke="#0004" stroke-width="2" stroke-dasharray="2 5" stroke-linecap="round"/>`,
  scythe:`<path d="M12 59 41 16" ${DK} stroke-width="5"/><path d="M12 59 41 16" stroke="url(#g${id})" stroke-width="2.5" stroke-linecap="round" fill="none"/><path d="M38 17C52 4 64 18 59 35 58 25 51 20 41 24z" ${F}/><path d="M45 14c6-1 10 3 12 8" ${HL}/>`,
  axe:`<path d="M14 59 41 14" ${DK} stroke-width="5"/><path d="M14 59 41 14" stroke="url(#g${id})" stroke-width="2.5" stroke-linecap="round" fill="none"/><path d="M33 12 54 6c6 14 1 27-10 32l-8-9z" ${F}/><path d="M41 12c6 6 8 14 5 21" ${HL}/>`,
  saw:`<path d="M24 38 58 7l-2 8-5-1 1 7-6-1 0 7-6-1-1 7-6-1z" ${F}/><path d="M30 35 54 12" ${HL}/><path d="M21 33l12 12" ${DK} stroke-width="5"/><path d="M26 41 8 59" stroke="url(#g${id})" stroke-width="7" stroke-linecap="round"/>`,
  cane:`<path d="M20 59V24a12 12 0 0 1 24 0" stroke="url(#g${id})" stroke-width="9" stroke-linecap="round" fill="none"/><path d="M20 59V24a12 12 0 0 1 24 0" stroke="#fff9" stroke-width="9" stroke-dasharray="4 8" stroke-linecap="round" fill="none"/>`,
  shard:`<path d="M32 3 51 24 32 61 13 24z" ${F}/><path d="M13 24h38M23 24 32 3l9 21M23 24l9 37 9-37" fill="none" stroke="#fff7" stroke-width="1.6" stroke-linejoin="round"/>`,
  wing:`<path d="M6 42 18 14l7 14 7-20 7 20 7-14 12 28-26-8z" ${F}/><path d="M32 8v26" ${HL}/>`};
 const body=t==='gun'?GUNS[gv]:KNIVES[kv];
 return `<svg viewBox="0 0 64 64" width="64" height="64" style="filter:drop-shadow(0 0 7px ${gl})"><defs><linearGradient id="g${id}" x1="0" y1="0" x2="1" y2="1">${stops}</linearGradient></defs>${body}</svg>`}
function petTile(d){const H=hh(d.id),w=(d.name||'').replace(/^(Titanic|Huge) /,'').split(' '),ini=((w[0]||'?')[0]||'?')+(w[1]?w[1][0]:''),bd=d.rar==='titanic'?'#f5c542':'#b47cff';
 return `<svg viewBox="0 0 64 64" width="64" height="64"><defs><linearGradient id="t${d.id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="hsl(${H} 70% 55%)"/><stop offset="1" stop-color="hsl(${(H+40)%360} 70% 30%)"/></linearGradient></defs><rect x="4" y="4" width="56" height="56" rx="14" fill="url(#t${d.id})" stroke="${bd}" stroke-width="3"/><text x="32" y="40" text-anchor="middle" font-size="22" font-weight="800" fill="#fff" font-family="system-ui,sans-serif">${ini}</text></svg>`}
window._icFallback=function(img){const d=img.dataset;
 if(d.stage==='0'&&d.wiki){d.stage='1';img.src=d.wiki;return}
 img.outerHTML=icSvg(d)};
const ic=i=>/^(https?:)?\//.test(i.icon)?`<img src="${i.icon}" loading="lazy" alt="${i.name}" data-stage="1" data-type="${i.type}" data-rar="${i.rarity||''}" data-id="${i.id}" data-name="${i.name}" onerror="_icFallback(this)">`:`<img src="/icons/${i.id}.png" loading="lazy" alt="${i.name}" data-stage="0" data-wiki="${i.type==='pet'?'':wikiImg(i.name)}" data-emoji="${i.icon}" data-type="${i.type}" data-rar="${i.rarity||''}" data-id="${i.id}" onerror="_icFallback(this)">`;
const card=(i,x='',c='',o='')=>`<div class="card ${c} ${i.rarity==='titanic'?'tt':i.rarity==='huge'?'hg':''}" ${o}><div class="ic">${ic(i)}</div><b>${i.name}</b><small>${PS()?CI()+' ':''}${fmt(i.value)}</small>${x}</div>`;
const byId=id=>S.items.find(i=>i.id===id),mlt=(m,n)=>{let x=.97;for(let k=0;k<n;k++)x*=(25-k)/(25-m-k);return x};
const hue=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))%360;return `hsl(${h} 65% 60%)`};
async function load(){const r0=await api('state',{iv:ITEMSIV});if(r0.mode&&r0.mode!==MODE)return;if(r0.items){ITEMSC=r0.items;ITEMSIV=r0.iv}else if(r0.me)r0.items=ITEMSC;S=r0;if(S.rain&&S.rain.now)rainSkew=S.rain.now-Date.now();document.body.className=cfg.anim?'':'noanim';if(S.error||(!S.guest&&!S.me)){if(!S.me&&!$('#view'))$('#app').innerHTML='<pre style="color:#f87171;padding:14px;white-space:pre-wrap">Server error: '+(S.error||'no response')+'</pre>';return}if(S.guest){if(!$('#lg'))login();return}if(!$('#view'))shell();head();if(tab==='jackpot')jpUpdate();cfWatch();tipWatch();if(tab==='home'&&$('#view')&&$('#view').firstElementChild)rHome($('#view'));chatTick()}
let tick=0;setInterval(()=>{if(document.hidden||pend||(S&&S.guest))return;if(tab!=='jackpot'&&tab!=='coinflip'&&++tick%6)return;load()},1500);
function login(){if($('#un'))return;$('#app').innerHTML=`<main><div class="box" style="max-width:420px;margin:60px auto"><div class="logo" style="font-size:30px;justify-content:center"><img src="${LG()}" alt="" style="width:44px;height:44px"><span>${BRAND()}</span></div><div style="display:flex;justify-content:center;margin:2px 0 14px">${msw()}</div><p class="muted">Verify your Roblox account to play.</p><div id="lg"><input id="un" placeholder="Roblox username" style="width:100%;margin-bottom:10px"><button class="big" style="margin:0" onclick="vstart()">Get verification code</button></div><p class="muted" style="font-size:11px;margin-top:14px">We log basic device/network info to prevent multi-accounting and abuse.</p></div></main>`}
async function vstart(){const r=await api('start',{username:$('#un').value});if(!r.code)return;pend=r;
 $('#lg').innerHTML=`<p>Paste this into your <b>Roblox bio (About)</b> within 10 minutes:</p><div class="box" style="background:var(--p2);user-select:all;font-weight:700">${r.code}</div><p class="muted" id="cd"></p><button class="s" onclick="navigator.clipboard.writeText('${r.code}');toast('Copied')">Copy code</button>`;
 const t=setInterval(async()=>{if(!pend)return clearInterval(t);const s=Math.max(0,Math.round((r.exp-Date.now())/1000));$('#cd').textContent=`Waiting for bio… expires in ${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
  if(s%3===0){const c=await api('check',{tok:r.tok});if(c.ok){pend=null;clearInterval(t);load()}else if(c.error){pend=null;clearInterval(t);$('#app').innerHTML='';login()}}},1000)}
function shell(){const m=S.me;$('#app').innerHTML=`<aside id="sb"><div class="logo"><img src="${LG()}" alt=""><span>${BRAND()}</span></div><div class="uc"><img class="av" src="${m.avatar}" alt=""><div><b>${m.name}</b><span class="tok" id="sbt"></span></div></div><div id="nv">${NAV.filter(n=>(n[0]!=='admin'||m.admin)&&(!n[3]||PS())).map(n=>`<button id="t_${n[0]}" onclick="go('${n[0]}')">${ICO(n[1])}<span>${n[2]}</span></button>`).join('')}</div></aside><div id="ov" onclick="sb(0)"></div><div id="mn"><div class="top"><button class="s mb" onclick="sb(1)">☰</button>${msw()}<b id="tt"></b><span class="tok" id="hd"></span></div><main id="view"></main></div><button id="chatbtn" onclick="chatToggle()">💬</button><div id="chatpanel"></div>`;go(tab)}
const sb=o=>{$('#sb').classList.toggle('open',!!o);$('#ov').classList.toggle('show',!!o)};
function head(){const t=(cfg.hide?'••••':fmt(S.me.tokens))+' '+CI();if($('#hd'))$('#hd').innerHTML=t;if($('#sbt'))$('#sbt').innerHTML=t}
function go(t){const was=tab;tab=t;sel={};q='';sb(0);const n=NAV.find(x=>x[0]===t);if(GAMES.includes(t)&&was!==t)splash(n[2]);document.querySelectorAll('#nv button').forEach(b=>b.classList.toggle('on',b.id==='t_'+t));$('#tt').textContent=n[2];const my=++nav;
 $('#view').innerHTML=`<div class="ld"><div class="sp"></div><span class="muted">Loading ${n[2]}…</span></div>`;
 setTimeout(async()=>{if(my!==nav)return;await load();if(my===nav)render()},cfg.anim?550:0)}
const render=()=>{({home:rHome,values:rValues,inventory:rInv,exchange:rEx,jackpot:rJP,coinflip:rCf,blackjack:rBj,mines:rMines,towers:rTw,tip:rTip,withdraw:rWd,deposit:rDep,leaderboard:rLb,players:rPl,settings:rSet,admin:rAdm})[tab]($('#view'))};
function srch(f){return`<input placeholder="Search items…" value="${q}" oninput="q=this.value;${f}()" style="width:100%;margin-bottom:12px">`}
const filt=l=>l.filter(i=>i.name.toLowerCase().includes(q.toLowerCase()));
let vf='all';
// ---- Player search / profiles ----
let pq='',pres=[],pprof=null,pTarget=null,ptm;
const ago=t=>{if(!t)return'never';const s=Math.max(0,Math.floor((Date.now()-t)/1000));return s<60?'just now':s<3600?Math.floor(s/60)+'m ago':s<86400?Math.floor(s/3600)+'h ago':Math.floor(s/86400)+'d ago'};
function rPl(v){v.innerHTML=`<div class="box"><h3>Player search</h3><input id="pqi" placeholder="Search Roblox username or ID…" value="${pq.replace(/"/g,'&quot;')}" oninput="pSearch(this.value)" style="width:100%"><div id="pres" class="rcp" style="margin-top:10px"></div></div><div id="pprof"></div>`;pRes();pProf();pLoad()}
function pSearch(x){pq=x;clearTimeout(ptm);if(!x.trim()){pres=[];pRes();return}ptm=setTimeout(async()=>{const r=await api('psearch',{q:x});if(pq===x){pres=r.list||[];pRes()}},250)}
function pRes(){const e=$('#pres');if(!e)return;e.innerHTML=pres.map(u=>`<button class="rc ${pTarget===u.id?'on':''}" onclick="openP('${u.id}')"><img class="av" src="${u.avatar}" alt="">${u.name}</button>`).join('')||(pq.trim()?'<span class="muted">No players found.</span>':'<span class="muted">Type a name, or click a player on Home, Leaderboard or chat.</span>')}
async function pLoad(){if(!pTarget||!$('#pprof'))return;const id=pTarget,r=await api('profile',{q:id});if(id!==pTarget)return;pprof=r.p||null;pProf()}
function openP(id){pTarget=String(id);pprof=null;if(tab!=='players')go('players');else{pProf();pRes();pLoad()}}
function pProf(){const e=$('#pprof');if(!e)return;const p=pprof;if(!p){e.innerHTML=pTarget?'<div class="box"><div class="ld" style="padding:30px 0"><div class="sp"></div></div></div>':'';return}
 const st=(l,x,c='')=>`<div class="mchip" style="text-align:left;padding:10px 12px"><small>${l}</small><b class="${c}">${x}</b></div>`,pc=p.profit<0?'':'g',nw=p.balance+p.invValue;
 e.innerHTML=`<div class="box"><div class="row" style="margin:0 0 14px;gap:14px"><img class="av" src="${p.avatar}" alt="" style="width:64px;height:64px"><div style="flex:1;min-width:0"><h3 style="margin:0">${p.name} <span style="color:${p.online?'var(--g)':'var(--m)'};font-size:12px;font-weight:600">● ${p.online?'Online':'Seen '+ago(p.lastSeen)}</span></h3><div class="muted" style="font-size:12px">Roblox ID ${p.id} · <a href="https://www.roblox.com/users/${p.id}/profile" target="_blank" rel="noopener" style="color:var(--ac2)">Roblox profile</a></div></div>${p.id!==S.me.id?`<button class="s" onclick="tipTo='${p.name}';go('tip')">Tip</button>`:''}</div>
 <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px">
 ${st(PS()?'Gems':'Tokens',fmt(p.balance)+' '+CI(),'tok')}${st('Inventory value',fmt(p.invValue))}${st('Net worth',fmt(nw))}
 ${st('Total wagered',fmt(p.wagered)+' '+CI())}${st('Total profit',(p.profit>=0?'+':'−')+fmt(Math.abs(p.profit))+' '+CI(),pc)}${st('Wager rank',p.rank?'#'+p.rank+' <span class="muted" style="font-size:11px">of '+p.players+'</span>':'—')}
 ${st('Wagered today',fmt(p.todayWag)+' '+CI())}${st('Profit today',(p.todayProfit>=0?'+':'−')+fmt(Math.abs(p.todayProfit))+' '+CI(),p.todayProfit<0?'':'g')}${st(PS()?'Pets owned':'Items owned',p.pieces+' <span class="muted" style="font-size:11px">('+p.kinds+' unique)</span>')}

 <label class="lb">Difficulty</label><div class="dfs">${Object.keys(TWD).map(x=>`<button class="s ${twd===x?'on':''}" onclick="twd='${x}';twr()">${TWN[x]}<br><small>${TWD[x][0]} tiles · ${TWD[x][1]} 💣</small></button>`).join('')}</div>
 <div class="stat"><span>Your balance</span><b class="tok">${fmt(S.me.tokens)} ${CI()}</b></div><button class="big" onclick="twst()" ${twbusy?'disabled':''}>${twbusy?'Building tower…':'Start game'}</button>`;
 const rows=[];for(let f=TWR-1;f>=0;f--){const isCur=g&&f===n,done=g?f<n:false;
  const tiles=Array.from({length:c},(_,i)=>{const pk=picks[f]===i,hitRow=ended&&r.boom&&f===picks.length-1,isB=bombs&&bombs[f]&&bombs[f].includes(i);
   const safe=pk&&!(hitRow&&pk),hit=pk&&hitRow;
   const cls=safe?'gem':hit?'bomb hit':isB?'bomb dim':'';
   return `<button class="mt ${cls}" ${isCur&&!twbusy?`onclick="twp(${i})"`:'disabled'} aria-label="floor ${f+1} tile ${i+1}">${safe?GEM:(hit||isB)?BOMB:''}</button>`}).join('');
  rows.push(`<div class="twr ${isCur?'cur':''} ${g&&!isCur&&!done?'off':''}" style="--c:${c}"><small>${twm(d,f+1).toFixed(2)}x</small>${tiles}</div>`)}
 const msg=ended?(r.boom?`<div class="mres lose">💥 Boom!<small>Floor ${picks.length} — you lost your bet</small></div>`:`<div class="mres win">Cashed out +${fmt(r.cashed)} ${CI()}<small>${picks.length} floor${picks.length===1?'':'s'} climbed</small></div>`):'';
 v.innerHTML=`<div class="mw"><div class="box mctl"><h3>🗼 Towers <span class="muted">— ${TWR} floors · ${CN()} only</span></h3>${setup}</div><div class="mstage"><div class="mchips">${chips}</div><div class="twgrid">${rows.join('')}</div>${msg}</div></div>`}
const twr=()=>{if(tab==='towers')rTw($('#view'))};
function twset(x){twbet=x?Math.max(MINB(),Math.floor(twbet*x)):Math.max(MINB(),Math.floor(S.me.tokens));twr()}
async function twst(){if(twbusy)return;if(!(twbet>=MINB())){toast('Minimum bet is '+fmt(MINB()));return}twres=null;twbusy=true;twr();await new Promise(r=>setTimeout(r,cfg.anim?600:0));await api('twstart',{bet:twbet,diff:twd});twbusy=false;await load();twr()}
async function twp(i){const r=await api('twpick',{i});if(r.boom||r.cashed!=null)twres=r;await load();twr()}
async function twca(){const r=await api('twcash');if(r.cashed!=null)twres=r;await load();twr()}

// ---- Blackjack ----
let bjBet=MODE==='ps99'?1000000:10,bjBusy=false,bjSeen={id:0,p:0,d:0,hole:false};
const bjFace=c=>{const r=c.slice(0,-1),s=c.slice(-1),red='♥♦'.includes(s);return `<div class="face ${red?'red':''}"><i class="cr">${r}<em>${s}</em></i><b class="cs">${s}</b><i class="cr bt">${r}<em>${s}</em></i><img class="wm" src="${LG()}" alt=""></div>`};
const bjBackH='<div class="back"><div class="bdr"><img src="'+LG()+'" alt=""></div></div>';
const bjCard=(c,cls='',d=0)=>`<div class="pcard ${cls}" style="--d:${d.toFixed(2)}s"><div class="inner">${c?bjFace(c):'<div class="face"></div>'}${bjBackH}</div></div>`;
function rBj(v){const g=S.bj,live=g&&!g.done,fresh=!g||g.id!==bjSeen.id;
 if(fresh)bjSeen={id:g?g.id:0,p:0,d:0,hole:false};
 let t=0;const step=.38;let pc='',dc='';
 if(g){const P=g.player,D=g.dealer;
  if(fresh){P.forEach((c,i)=>{pc+=bjCard(c,'deal',i*.5)});D.forEach((c,i)=>{dc+=bjCard(c,'deal'+(c?'':' down'),.25+i*.5)});t=1.1}
  else{P.forEach((c,i)=>{if(i<bjSeen.p)pc+=bjCard(c);else{pc+=bjCard(c,'deal',t);t+=step+.2}});
   D.forEach((c,i)=>{if(!c)dc+=bjCard(null,'down');else if(i===1&&!bjSeen.hole&&bjSeen.d>=2&&bjSeen.holeDown){dc+=bjCard(c,'rev',t);t+=.7}else if(i<bjSeen.d)dc+=bjCard(c);else{dc+=bjCard(c,'deal',t);t+=step+.2}})}
  bjSeen={id:g.id,p:g.player.length,d:g.dealer.length,hole:!!g.dealer[1],holeDown:!g.dealer[1]}}
 const res=g&&g.done?g.result:null,lab={bj:'BLACKJACK!',win:'YOU WIN',lose:'DEALER WINS',bust:'BUST',push:'PUSH'}[res],cls={bj:'bj',win:'win',lose:'lose',bust:'lose',push:'push'}[res];
 const pv=g?g.pv:0,dv=g?g.dv:0,net=g?g.payout-g.bet:0;
 const sub=res?(res==='push'?'Bet returned':net>0?`+${fmt(net)} ${CI()}`+(res==='win'&&dv>21?' · dealer busts':''):`−${fmt(g.bet)} ${CI()}`):'';
 const ctl=live?`<div class="bjact"><button class="hit" onclick="bjAct('bjhit')" ${bjBusy?'disabled':''}>Hit</button><button class="stand" onclick="bjAct('bjstand')" ${bjBusy?'disabled':''}>Stand</button><button class="dbl" onclick="bjAct('bjdouble')" ${bjBusy||!g.canDouble||S.me.tokens<g.bet?'disabled':''}>Double</button></div>`
 :`<div class="bjbet"><label class="lb" style="margin:0 0 6px">Bet <span class="muted" style="text-transform:none">(min ${fmt(MINB())})</span></label><div class="row"><input id="bjb" type="number" min="${MINB()}" value="${bjBet}" oninput="bjBet=+this.value" style="flex:1;min-width:80px"><button class="s" onclick="bjSet(.5)">½</button><button class="s" onclick="bjSet(2)">2×</button><button class="s" onclick="bjSet(0)">Max</button></div><div class="row">${BETS().map(x=>`<button class="s" onclick="bjBet=${x};rBj($('#view'))">${fmt(x)}</button>`).join('')}</div><button class="big" onclick="bjDeal()" ${bjBusy?'disabled':''}>${g?'Deal again':'Deal'}</button></div>`;
 v.innerHTML=`<div class="bjw"><div class="felt"><div class="deckp"><div class="pcard down"><div class="inner">${bjBackH}${'<div class="face"></div>'}</div></div><div class="pcard down"><div class="inner">${bjBackH}<div class="face"></div></div></div><div class="pcard down"><div class="inner">${bjBackH}<div class="face"></div></div></div></div>
 <div class="dealer"><div class="lbl">DEALER ${g?`<span class="tot ${dv>21?'bust':''}">${live?dv+' + ?':dv}</span>`:''}</div><div class="hand ${res&&(res==='lose'||res==='bust')?'win':''}">${dc||'<span class="muted" style="align-self:center">Place your bet</span>'}</div></div>
 ${res?`<div class="bjres ${cls}" style="--d:${(t+.3).toFixed(2)}s"><div class="big2">${lab}</div><small>${sub}</small></div>`:'<div style="min-height:20px"></div>'}
 <div class="player"><div class="hand ${res==='win'||res==='bj'?'win':res==='lose'||res==='bust'?'lose':''}">${pc}</div><div class="lbl">YOU ${g?`<span class="tot ${pv>21?'bust':pv===21?'b21':''}">${pv}</span>`:''}</div></div>${ctl}</div>
 <div class="box bjinfo"><h3>🃏 Blackjack</h3><div class="stat"><span>Balance</span><b class="tok">${fmt(S.me.tokens)} ${CI()}</b></div>${g?`<div class="stat"><span>Current bet</span><b>${fmt(g.bet)} ${CI()}${g.doubled?' (doubled)':''}</b></div>`:''}
 <p class="muted" style="font-size:12px;line-height:1.6;margin-top:12px"><b style="color:var(--t)">Rules</b><br>• Beat the dealer without going over 21<br>• Blackjack pays 3:2<br>• Dealer stands on 17<br>• Double = one card, double bet<br>• Fresh shuffled deck every hand</p></div></div>`;
 if(!live&&$('#bjb'))void 0}
function bjSet(x){bjBet=x?Math.max(MINB(),Math.floor(bjBet*x)):Math.max(MINB(),Math.floor(S.me.tokens));rBj($('#view'))}
async function bjDeal(){if(bjBusy)return;if(!(bjBet>=MINB())){toast('Minimum bet is '+fmt(MINB()));return}bjBusy=true;const r=await api('bjstart',{bet:bjBet});bjBusy=false;await load();if(tab==='blackjack')rBj($('#view'))}
async function bjAct(a){if(bjBusy)return;bjBusy=true;rBj($('#view'));await api(a);bjBusy=false;await load();if(tab==='blackjack')rBj($('#view'))}

load();
</script></body></html>
