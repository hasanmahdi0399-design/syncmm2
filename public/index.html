<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sync MM2</title>
<style>
:root{--bg:#0b0d14;--p:#141826;--p2:#1c2236;--a:#7c5cff;--t:#e8eaf5;--m:#8b92ad;--g:#3ddc97;--r:#ff5c7a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:14px system-ui,sans-serif}
button,input,select{font:inherit;color:var(--t);background:var(--p2);border:1px solid #2a3150;border-radius:8px;padding:8px 12px}
button{cursor:pointer;background:var(--a);border:0;font-weight:600}button:disabled{opacity:.5}button.s{background:var(--p2);border:1px solid #2a3150}
header{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:var(--p);position:sticky;top:0;z-index:5;gap:8px;flex-wrap:wrap}
.logo{font-weight:800;font-size:18px;color:var(--a)}nav{display:flex;gap:6px;overflow-x:auto;padding:10px 14px}nav button{background:var(--p);border:1px solid #2a3150;white-space:nowrap}nav button.on{background:var(--a)}
main{padding:14px;max-width:1000px;margin:auto}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.card{background:var(--p);border:1px solid #232a44;border-radius:12px;padding:10px;text-align:center;cursor:pointer;transition:transform .15s,border-color .15s;position:relative}
.card:hover{transform:translateY(-3px);border-color:var(--a)}.card.sel{border-color:var(--g);box-shadow:0 0 0 1px var(--g)}
.ic{height:64px;display:flex;align-items:center;justify-content:center;font-size:42px}.ic img{max-height:64px;max-width:100%}
.card b{display:block;font-size:12px;margin:4px 0}.card small{color:var(--g)}.box{background:var(--p);border-radius:12px;padding:14px;margin-bottom:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}h3{margin:0 0 10px}.muted{color:var(--m)}.tok{color:#ffd166;font-weight:700}
#wheel{width:240px;height:240px;border-radius:50%;margin:10px auto;border:4px solid var(--p2);position:relative}
.ptr{width:0;height:0;border:12px solid transparent;border-top:22px solid #fff;margin:0 auto -14px;position:relative;z-index:2}
.mg{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;max-width:340px}.mg button{height:56px;font-size:22px;background:var(--p2);border:1px solid #2a3150}
.mg .ok{background:#143d2c;animation:pop .3s}.mg .bm{background:#4a1626;animation:pop .3s}@keyframes pop{from{transform:scale(.6)}to{transform:scale(1)}}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--r);padding:10px 16px;border-radius:10px;display:none;z-index:9}
table{width:100%;border-collapse:collapse}td,th{padding:6px;text-align:left;border-bottom:1px solid #232a44}.av{width:26px;height:26px;border-radius:50%;vertical-align:middle;margin-right:6px}
.bar{height:6px;border-radius:3px;background:var(--a)}.noanim *{animation:none!important;transition:none!important}
</style></head><body><div id="app"></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),fmt=n=>Math.floor(n).toLocaleString();
let S=null,tab='values',q='',sel={},mres=null,seen=0,pend=null,cfg=JSON.parse(localStorage.cfg||'{"anim":true,"hide":false}');
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._);t._=setTimeout(()=>t.style.display='none',2500)};
const api=async(a,b={})=>{try{const r=await fetch('/api/'+a,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b)});const j=await r.json();if(j.error)toast(j.error);return j}catch{toast('Network error');return{}}};
const ic=i=>/^(https?:)?\//.test(i.icon)?`<img src="${i.icon}" loading="lazy" alt="">`:`<span>${i.icon}</span>`;
const card=(i,x='',c='',o='')=>`<div class="card ${c}" ${o}><div class="ic">${ic(i)}</div><b>${i.name}</b><small>${fmt(i.value)}</small>${x}</div>`;
const byId=id=>S.items.find(i=>i.id===id);
const hue=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))%360;return `hsl(${h} 70% 55%)`};
async function load(){S=await api('state');document.body.className=cfg.anim?'':'noanim';if(S.guest)return login();head();if(!$('#view'))shell();
 if(tab==='jackpot')jpUpdate();else if(tab==='admin'||tab==='mines')0;}
setInterval(()=>{if(!document.hidden&&!pend)load()},1500);
function login(){$('#app').innerHTML=`<main><div class="box" style="max-width:420px;margin:60px auto"><div class="logo" style="font-size:28px">Sync MM2</div><p class="muted">Verify your Roblox account to play.</p>
<div id="lg"><input id="un" placeholder="Roblox username" style="width:100%;margin-bottom:8px"><button style="width:100%" onclick="vstart()">Get verification code</button></div></div></main>`}
async function vstart(){const r=await api('start',{username:$('#un').value});if(!r.code)return;pend=r;
 $('#lg').innerHTML=`<p>Paste this into your <b>Roblox bio (About)</b> within 10 minutes:</p><div class="box" style="background:var(--p2);user-select:all;font-weight:700">${r.code}</div><p class="muted" id="cd"></p><button class="s" onclick="navigator.clipboard.writeText('${r.code}');toast('Copied')">Copy</button>`;
 const t=setInterval(async()=>{if(!pend)return clearInterval(t);const s=Math.max(0,Math.round((r.exp-Date.now())/1000));$('#cd').textContent=`Waiting for bio… expires in ${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
  if(s%3===0){const c=await api('check',{tok:r.tok});if(c.ok){pend=null;clearInterval(t);load()}else if(c.error){pend=null;clearInterval(t);login()}}},1000)}
function shell(){$('#app').innerHTML=`<header><span class="logo">Sync MM2</span><span id="hd"></span></header><nav id="nv"></nav><main id="view"></main>`;
 const T=['values','inventory','exchange','jackpot','mines','withdraw','deposit','leaderboard','settings'];if(S.me.admin)T.push('admin');
 $('#nv').innerHTML=T.map(t=>`<button id="t_${t}" onclick="go('${t}')">${t[0].toUpperCase()+t.slice(1)}</button>`).join('');go(tab)}
function head(){if(!$('#hd'))return;$('#hd').innerHTML=`<img class="av" src="${S.me.avatar}" alt=""><b>${S.me.name}</b> &nbsp; <span class="tok">🪙 ${cfg.hide?'••••':fmt(S.me.tokens)}</span>`}
function go(t){tab=t;sel={};q='';document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.id==='t_'+t));render()}
function render(){const v=$('#view');({values:rValues,inventory:rInv,exchange:rEx,jackpot:rJP,mines:rMines,withdraw:rWd,deposit:rDep,leaderboard:rLb,settings:rSet,admin:rAdm})[tab](v)}
function srch(f){return`<input placeholder="Search…" value="${q}" oninput="q=this.value;${f}()" style="width:100%;margin-bottom:10px">`}
const filt=l=>l.filter(i=>i.name.toLowerCase().includes(q.toLowerCase()));
function rValues(v){v.innerHTML=`<h3>Values of Items</h3>${srch('vl')}<div class="grid" id="g"></div>`;vl()}
function vl(){$('#g').innerHTML=filt([...S.items].sort((a,b)=>b.value-a.value)).map(i=>card(i)).join('')}
const owned=()=>S.items.filter(i=>S.me.inv[i.id]).map(i=>({...i,q:S.me.inv[i.id]}));
function pick(id){const m=S.me.inv[id]||0;sel[id]=(sel[id]||0)+1;if(sel[id]>m)delete sel[id];render()}
const selCard=i=>card(i,`<small class="muted"> ${sel[i.id]?sel[i.id]+'/':'x'}${i.q}</small>`,sel[i.id]?'sel':'',`onclick="pick('${i.id}')"`);
const selVal=()=>Object.entries(sel).reduce((s,[k,n])=>s+byId(k).value*n,0);
function rInv(v){v.innerHTML=`<div class="box"><h3>Inventory</h3><p>Total item value: <b>${fmt(S.me.invValue)}</b> <span class="muted">(tokens not included)</span> · Tokens: <span class="tok">${fmt(S.me.tokens)}</span></p></div><div class="grid">${owned().map(i=>card(i,` <small class="muted">x${i.q}</small>`)).join('')||'<p class="muted">Empty.</p>'}</div>`}
function rEx(v){v.innerHTML=`<div class="box"><h3>Sell items (90% in tokens)</h3><div class="grid">${owned().map(i=>card(i,`<small class="muted"> x${i.q} · ${fmt(i.value*.9)}🪙</small><button style="width:100%;margin-top:6px" onclick="ev(event);sell('${i.id}')">Sell 1</button>`)).join('')||'<p class="muted">Nothing to sell.</p>'}</div></div>
<div class="box"><h3>Shop (110%)</h3><div class="grid">${S.items.filter(i=>S.shop[i.id]).map(i=>card(i,`<small class="muted"> stock ${S.shop[i.id]} · ${fmt(Math.ceil(i.value*1.1))}🪙</small><button style="width:100%;margin-top:6px" onclick="buy('${i.id}')">Buy 1</button>`)).join('')||'<p class="muted">Shop is empty.</p>'}</div></div>`}
const ev=e=>e.stopPropagation();
async function sell(id){await api('sell',{item:id,qty:1});await load();render()}async function buy(id){await api('buy',{item:id,qty:1});await load();render()}
function rJP(v){v.innerHTML=`<div class="box"><h3>Jackpot <span class="muted">— items only · 10% tax</span></h3><div class="ptr"></div><div id="wheel"></div><p id="jt" style="text-align:center"></p><div id="jr" style="text-align:center;font-weight:700"></div><div id="jl"></div></div>
<div class="box"><h3>Select items to join</h3><p>Selected value: <b>${fmt(selVal())}</b></p><div class="grid">${owned().map(selCard).join('')}</div><div class="row" style="margin-top:10px"><button onclick="jpj()">Join jackpot</button><button class="s" onclick="jpl()">Leave (if alone)</button></div></div>`;jpUpdate(true)}
async function jpj(){if((await api('jpjoin',{items:sel})).ok)sel={};await load();render()}async function jpl(){await api('jpleave');await load();render()}
let wheelSig='';
function jpUpdate(f){const j=S.jp,w=$('#wheel');if(!w)return;const sig=j.players.map(p=>p.id+p.value).join();
 if(sig!==wheelSig||f){wheelSig=sig;let a=0;const st=j.players.map(p=>{const s=`${hue(p.id)} ${a}% ${a+p.pct}%`;a+=p.pct;return s});
  if(!(spinning))w.style.background=st.length?`conic-gradient(${st.join(',')})`:'var(--p2)';
  $('#jl').innerHTML=`<table>${j.players.map(p=>`<tr><td><img class="av" src="${p.avatar}" alt=""><span style="color:${hue(p.id)}">${p.name}</span></td><td>${fmt(p.value)}</td><td>${p.pct.toFixed(1)}%</td></tr>`).join('')}</table>`}
 const left=j.end?Math.max(0,Math.ceil((j.end-j.now)/1000)):0;$('#jt').textContent=j.players.length<2?'Waiting for 2+ players…':`Spinning in ${left}s · Pot ${fmt(j.total)}`;
 const l=j.last;if(l&&l.rid!==seen){const fresh=Date.now()-(j.now-l.t)>0&&(j.now-l.t)<12000;seen=l.rid;if(fresh)spin(l)}}
let spinning=false;
function spin(l){const w=$('#wheel');if(!w)return;spinning=true;let a=0,c=0;const t=l.snap.reduce((s,p)=>s+p.value,0);
 const st=l.snap.map(p=>{const pc=p.value/t*100;if(p.id===l.winner)c=(a+pc/2)*3.6;const s=`${hue(p.id)} ${a}% ${a+pc}%`;a+=pc;return s});
 w.style.transition='none';w.style.transform='rotate(0)';w.style.background=`conic-gradient(${st.join(',')})`;w.offsetWidth;
 w.style.transition=cfg.anim?'transform 5s cubic-bezier(.12,.7,.1,1)':'none';w.style.transform=`rotate(${360*6-c}deg)`;
 setTimeout(()=>{$('#jr').innerHTML=`🏆 ${l.name} won ${fmt(l.total-l.taxed)} value! <span class="muted">(tax ${fmt(l.taxed)})</span>`;spinning=false;wheelSig='';load()},cfg.anim?5200:0)}
function rMines(v){const g=S.mines,r=mres;let h=`<div class="box"><h3>Mines <span class="muted">— tokens only</span></h3>`;
 if(!g)h+=`<div class="row"><input id="mb" type="number" min="1" placeholder="Bet (tokens)"><select id="mm">${[1,3,5,8,10].map(n=>`<option>${n}</option>`).join('')}</select> mines <button onclick="mst()">Start</button></div>`;
 else h+=`<p>Bet ${fmt(g.bet)} · ${g.m} mines · <b style="color:var(--g)">${g.mult.toFixed(2)}x</b> = ${fmt(g.bet*g.mult)}🪙 <button onclick="mca()" ${g.open.length?'':'disabled'}>Cash out</button></p>`;
 h+=`<div class="mg" style="margin-top:10px">${Array.from({length:25},(_,i)=>{const o=(g?g.open:r?r.open:[]).includes(i),b=!g&&r&&r.mines.includes(i);return`<button class="${o?'ok':b?'bm':''}" ${g&&!o?`onclick="mp(${i})"`:'disabled'}>${o?'💎':b?'💣':''}</button>`}).join('')}</div>`;
 if(!g&&r)h+=`<p style="margin-top:10px">${r.boom?'💥 Boom! You lost.':'✅ Cashed out '+fmt(r.cashed)+'🪙'}</p>`;v.innerHTML=h+'</div>'}
async function mst(){mres=null;await api('minesstart',{bet:$('#mb').value,m:$('#mm').value});await load();render()}
async function mp(i){const r=await api('minespick',{i});if(r.boom)mres=r;await load();render()}
async function mca(){const r=await api('minescash');if(r.cashed!=null)mres=r;await load();render()}
function rWd(v){const wl=owned().filter(i=>['gun','knife'].includes(i.type));v.innerHTML=`<div class="box"><h3>Withdraw (guns &amp; knives only)</h3><div class="grid">${wl.map(i=>card(i,`<small class="muted"> x${i.q}</small><button style="width:100%;margin-top:6px" onclick="wd('${i.id}')">Request 1</button>`)).join('')||'<p class="muted">No withdrawable items.</p>'}</div></div>
<div class="box"><h3>Your requests</h3><table>${S.wd.map(w=>`<tr><td>${w.qty}x ${byId(w.item).name}</td><td>${w.status}</td></tr>`).join('')}</table></div>`}
async function wd(id){await api('withdraw',{item:id,qty:1});toast('Request sent');await load();render()}
function rDep(v){v.innerHTML=`<div class="box"><h3>Deposit</h3><p>Join the Discord and open a ticket to deposit manually.</p><a href="https://discord.gg/AFyru7hAnn" target="_blank" rel="noopener"><button>Join Discord</button></a></div>`}
async function rLb(v){v.innerHTML='<p class="muted">Loading…</p>';const d=await api('lb');const t=(n,l)=>`<div class="box"><h3>${n}</h3><table>${l.map((u,i)=>`<tr><td>${i+1}</td><td><img class="av" src="${u.avatar}" alt="">${u.name}</td><td style="color:${u.v<0?'var(--r)':'var(--g)'}">${fmt(u.v)}</td></tr>`).join('')}</table></div>`;v.innerHTML=t('Top Wagered',d.wagered)+t('Top Profit',d.profit)}
function rSet(v){v.innerHTML=`<div class="box"><h3>Settings</h3><p><label><input type="checkbox" ${cfg.anim?'checked':''} onchange="sc('anim',this.checked)"> Animations</label></p><p><label><input type="checkbox" ${cfg.hide?'checked':''} onchange="sc('hide',this.checked)"> Hide token balance</label></p><button class="s" onclick="api('logout').then(()=>location.reload())">Log out</button></div>`}
function sc(k,x){cfg[k]=x;localStorage.cfg=JSON.stringify(cfg);document.body.className=cfg.anim?'':'noanim';head()}
function rAdm(v){const A=S.admin,opts=S.items.map(i=>`<option value="${i.id}">${i.name}</option>`).join('');
 v.innerHTML=`<div class="box"><h3>Items &amp; tokens</h3><div class="row"><input id="au" placeholder="Username or ID"><select id="ai">${opts}</select><input id="aq" type="number" placeholder="Qty / amount / value" style="width:150px"></div>
<div class="row" style="margin-top:8px"><button onclick="ad('admgive')">Give item</button><button onclick="ad('admset')">Set item qty</button><button onclick="ad('admtokens')">Add tokens (±)</button><button onclick="ad('admvalue')">Set item value</button></div></div>
<div class="box"><h3>Games</h3><div class="row"><button onclick="api('admcanceljp').then(load)">Cancel jackpot</button><button onclick="ad('admcancelmines')">Cancel user's mines</button></div></div>
<div class="box"><h3>Withdrawals</h3><table>${A.wd.map(w=>`<tr><td>${w.name}</td><td>${w.qty}x ${byId(w.item).name}</td><td><button onclick="aw('${w.id}',1)">Approve</button> <button class="s" onclick="aw('${w.id}',0)">Reject</button></td></tr>`).join('')||'<tr><td class="muted">None pending</td></tr>'}</table></div>
<div class="box"><h3>Discord webhook ${A.webhook?'✅':''}</h3><div class="row"><input id="aw" placeholder="Webhook URL" style="flex:1"><button onclick="api('admwebhook',{url:$('#aw').value}).then(()=>toast('Saved'))">Save</button></div></div>`}
async function ad(a){const b={user:$('#au').value,item:$('#ai').value,qty:$('#aq').value,amount:$('#aq').value,value:$('#aq').value};if((await api(a,b)).ok)toast('Done');await load()}
async function aw(id,ok){await api('admwd',{id,ok});await load();render()}
load();
</script></body></html>
