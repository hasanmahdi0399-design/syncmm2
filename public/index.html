<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sync MM2</title><link rel="icon" type="image/png" href="/logo.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0b0d;--bg2:#101217;--p:#15171c;--p2:#1c1f26;--p3:#242831;--a:#c9cedb;--ac1:#7c6cf0;--ac2:#4fd1ff;--t:#eef0f4;--m:#8b90a0;--g:#4ade80;--r:#f87171;--ln:#262a33;--sh:0 8px 24px -8px #000a}
*{box-sizing:border-box}
body{margin:0;background:
  radial-gradient(900px 500px at 10% -10%,#1b1430 0%,transparent 60%),
  radial-gradient(700px 400px at 100% 0%,#0d2436 0%,transparent 55%),
  var(--bg);
  color:var(--t);font:14px/1.45 -apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:var(--t);background:var(--p2);border:1px solid var(--ln);border-radius:12px;padding:10px 13px;outline:none}
input:focus,select:focus{border-color:var(--ac1);box-shadow:0 0 0 3px #7c6cf02e}
button{cursor:pointer;background:linear-gradient(135deg,var(--ac1),#5a4ad1);color:#fff;border:0;font-weight:700;letter-spacing:.2px;transition:transform .12s ease,box-shadow .2s ease,opacity .2s ease;box-shadow:0 4px 14px -4px #7c6cf066}
button:hover:not(:disabled){box-shadow:0 6px 18px -4px #7c6cf088;transform:translateY(-1px)}
button:active:not(:disabled){transform:scale(.96) translateY(0)}button:disabled{opacity:.4;cursor:default;box-shadow:none}
button.s{background:var(--p2);color:var(--t);border:1px solid var(--ln);box-shadow:none}button.s:hover:not(:disabled){border-color:var(--a);box-shadow:none;background:var(--p3)}
input[type=range]{accent-color:var(--ac1);padding:0}
#sb{position:fixed;left:0;top:0;bottom:0;width:230px;background:linear-gradient(180deg,var(--p) 0%,var(--bg2) 100%);border-right:1px solid var(--ln);padding:14px 10px;z-index:20;transform:translateX(-100%);transition:transform .3s cubic-bezier(.2,.8,.2,1);overflow-y:auto}
#sb.open{transform:none}#ov{display:none;position:fixed;inset:0;background:#000a;backdrop-filter:blur(2px);z-index:15;animation:fade .2s both}#ov.show{display:block}
.logo{font-weight:800;font-size:20px;background:linear-gradient(135deg,var(--ac1),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent;padding:4px 8px 14px;letter-spacing:.3px}
.uc{display:flex;gap:10px;align-items:center;background:var(--p2);border:1px solid var(--ln);border-radius:14px;padding:10px;margin-bottom:12px}.uc b{display:block;word-break:break-all}
#nv button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:none;color:var(--m);padding:11px 12px;border-radius:10px;margin-bottom:2px;border:0;font-weight:600;box-shadow:none;position:relative}
#nv button:hover{background:var(--p2);color:var(--t);transform:none;box-shadow:none}
#nv button.on{background:linear-gradient(90deg,#7c6cf026,transparent);color:var(--t)}
#nv button.on::before{content:'';position:absolute;left:-10px;top:8px;bottom:8px;width:3px;border-radius:3px;background:linear-gradient(180deg,var(--ac1),var(--ac2))}
.top{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#15171ccc;backdrop-filter:blur(10px);position:sticky;top:0;z-index:5;border-bottom:1px solid var(--ln)}.top b{flex:1;font-size:16px}
main{padding:14px;max-width:960px;margin:auto}
@media(min-width:860px){#sb{transform:none}#mn{margin-left:230px}.top .mb{display:none}#ov{display:none!important}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.card{background:linear-gradient(180deg,var(--p2),var(--p));border:1px solid var(--ln);border-radius:14px;padding:10px;text-align:center;cursor:pointer;transition:transform .18s cubic-bezier(.2,.8,.2,1),border-color .18s,box-shadow .18s;animation:up .35s cubic-bezier(.2,.8,.2,1) both}
.card:hover{transform:translateY(-4px);border-color:#4a4f5e;box-shadow:var(--sh)}
.card.sel{border-color:var(--g);box-shadow:0 0 0 1px var(--g),0 0 16px -4px #4ade8077}
.ic{height:64px;display:flex;align-items:center;justify-content:center;font-size:42px;filter:drop-shadow(0 4px 8px #0006)}.ic img{max-height:64px;max-width:100%;object-fit:contain}
.card b{display:block;font-size:12px;margin:4px 0}.card small{color:var(--g)}.muted{color:var(--m)}.tok{color:#fbbf24;font-weight:700}
.box{background:linear-gradient(180deg,#1c1f26,#15171c);border:1px solid var(--ln);border-radius:16px;padding:16px;margin-bottom:14px;animation:up .35s cubic-bezier(.2,.8,.2,1) both;box-shadow:var(--sh)}h3{margin:0 0 12px;letter-spacing:.2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}.lb{display:block;color:var(--m);margin:14px 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.8px}
.stat{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--ln)}.stat:last-child{border-bottom:0}.g{color:var(--g)}
.big{width:100%;padding:14px;font-size:16px;margin-top:14px;border-radius:14px}
.mw{display:grid;grid-template-columns:1fr;gap:14px}@media(min-width:760px){.mw{grid-template-columns:300px 1fr}}
/* mines */
.mstage{background:radial-gradient(500px 300px at 50% 0%,#241d4a55,transparent 70%),linear-gradient(180deg,#171a22,#101218);border:1px solid #2c3140;border-radius:18px;padding:16px;box-shadow:var(--sh)}
.mchips{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}.mchip{background:#0d0f14;border:1px solid #2a2f3d;border-radius:12px;padding:8px 6px;text-align:center}
.mchip small{display:block;color:var(--m);font-size:10px;text-transform:uppercase;letter-spacing:.7px}.mchip b{font-size:15px}.mchip.hl b{color:var(--g)}
.mgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;width:min(460px,100%);margin:0 auto}
.mt{aspect-ratio:1;border-radius:14px;border:1px solid #444d63;background:linear-gradient(160deg,#363f55,#252b3b);box-shadow:inset 0 1px 0 #ffffff26,inset 0 -3px 0 #0003,0 6px 14px -6px #000c;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;transition:transform .12s,border-color .15s,box-shadow .15s}
.mt:not(:disabled):hover{transform:translateY(-3px);border-color:#9b8cff;box-shadow:inset 0 1px 0 #ffffff33,0 10px 22px -8px #7c6cf0cc;background:linear-gradient(160deg,#414b66,#2b3347)}
.mt:disabled{cursor:default;opacity:1}.mt svg{width:56%;height:56%}
.mt.gem{background:linear-gradient(160deg,#25a05c,#125a34);border-color:#6df0a2;box-shadow:0 0 20px -4px #4ade80aa,inset 0 1px 0 #ffffff44;animation:flip .45s cubic-bezier(.2,.8,.2,1)}
.mt.bomb{background:linear-gradient(160deg,#9b2a38,#4d121b);border-color:#ff8a8a;box-shadow:0 0 20px -4px #f87171aa;animation:flip .45s cubic-bezier(.2,.8,.2,1)}
.mt.bomb.dim{opacity:.55;box-shadow:none;animation:none}.mt.hit{animation:shake .5s,flip .45s}
.mgrid.pls .mt{animation:pulse .6s infinite alternate ease-in-out}
.mres{text-align:center;font:700 16px/1.3 'Syncopate',system-ui,sans-serif;letter-spacing:.1em;margin:14px 0 0;padding:12px;border-radius:12px}.mres.win{background:#4ade8018;color:var(--g);border:1px solid #4ade8055}.mres.lose{background:#f8717118;color:var(--r);border:1px solid #f8717155}
.mres small{display:block;font:500 13px system-ui,sans-serif;letter-spacing:0;color:var(--m);margin-top:4px}
.mctl .row button.on{outline:2px solid var(--ac2)}.mctl input[type=number]{text-align:center}
.cashbtn{background:linear-gradient(135deg,#22c55e,#15803d)!important;box-shadow:0 8px 22px -6px #22c55e99!important}
.ld{display:flex;flex-direction:column;align-items:center;gap:14px;padding:90px 0}
.sp{width:40px;height:40px;border:3px solid var(--p2);border-top-color:var(--ac1);border-right-color:var(--ac2);border-radius:50%;animation:rot .7s cubic-bezier(.5,.2,.5,.8) infinite}
@keyframes rot{to{transform:rotate(360deg)}}
@keyframes up{from{opacity:0;transform:translateY(12px) scale(.98)}}
@keyframes fade{from{opacity:0}}
@keyframes flip{from{transform:rotateY(90deg) scale(.6);opacity:.3}}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
@keyframes pulse{to{background:#2c3036;transform:scale(.9)}}
@keyframes slideUp{from{opacity:0;transform:translate(-50%,10px)}}
@keyframes spinIn{from{opacity:0;transform:scale(.7) translateY(8px)}}
#wheel{width:240px;height:240px;border-radius:50%;margin:10px auto;border:5px solid var(--p2);box-shadow:0 0 0 1px var(--ln),var(--sh)}
.ptr{width:0;height:0;border:12px solid transparent;border-top:22px solid var(--ac2);margin:0 auto -14px;position:relative;z-index:2;filter:drop-shadow(0 2px 4px #0008)}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,var(--r),#d85a5a);color:#fff;font-weight:600;padding:11px 18px;border-radius:12px;display:none;z-index:99;box-shadow:0 8px 24px -6px #000a;animation:slideUp .25s cubic-bezier(.2,.8,.2,1) both}
table{width:100%;border-collapse:collapse}td,th{padding:8px 7px;text-align:left;border-bottom:1px solid var(--ln)}.av{width:28px;height:28px;border-radius:50%;vertical-align:middle;margin-right:6px;background:var(--p3)}
.noanim *{animation:none!important;transition:none!important}
#chatbtn{position:fixed;right:18px;bottom:18px;width:54px;height:54px;border-radius:50%;font-size:22px;z-index:50;box-shadow:0 8px 24px -4px #7c6cf088;display:flex;align-items:center;justify-content:center;padding:0;background:linear-gradient(135deg,var(--ac1),#5a4ad1)}
#chatbtn.alert{background:linear-gradient(135deg,var(--r),#d85a5a);animation:pulse2 1s infinite}
@keyframes pulse2{50%{box-shadow:0 0 0 8px #f8717122}}
#chatpanel{position:fixed;right:18px;bottom:82px;width:300px;max-height:420px;z-index:50;padding:0;overflow:hidden;background:#15171cf2;backdrop-filter:blur(12px);border:1px solid var(--ln);border-radius:16px;display:none;flex-direction:column;box-shadow:var(--sh);animation:spinIn .2s cubic-bezier(.2,.8,.2,1) both}
#chatpanel.open{display:flex}
#chatmsgs{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:6px;max-height:300px}
.cmsg{font-size:12px;line-height:1.4;word-break:break-word;animation:up .2s both}.cmsg b{color:var(--ac2)}
#chatin{display:flex;gap:6px;padding:8px;border-top:1px solid var(--ln)}#chatin input{flex:1;min-width:0}
@media(max-width:480px){#chatpanel{width:calc(100vw - 24px);right:12px}}

.logo{display:flex;align-items:center;gap:10px;-webkit-background-clip:initial;background:none;color:var(--t)}
.logo img{width:28px;height:28px;object-fit:contain;filter:drop-shadow(0 0 8px #7c6cf0aa)}
.logo span{background:linear-gradient(135deg,var(--ac1),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
#splash{position:fixed;inset:0;z-index:999;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:22px;background:radial-gradient(600px 360px at 50% 45%,#161233 0%,#07080a 70%);pointer-events:all;animation:spOut .5s ease 1.25s forwards}
#splash img{width:104px;height:104px;object-fit:contain;filter:drop-shadow(0 0 22px #7c6cf0cc);animation:spLogo 1.1s cubic-bezier(.2,.8,.2,1) both}
#splash b{font:700 30px/1 'Syncopate','Eurostile','Segoe UI',system-ui,sans-serif;letter-spacing:.42em;text-indent:.42em;text-transform:uppercase;color:#fff;animation:spText .9s cubic-bezier(.2,.8,.2,1) .25s both}
#splash i{display:block;height:1px;width:0;background:linear-gradient(90deg,transparent,var(--ac2),transparent);animation:spLine 1s ease .3s forwards}
@keyframes spLogo{from{opacity:0;transform:scale(.6) rotate(-90deg)}to{opacity:1;transform:none}}
@keyframes spText{from{opacity:0;letter-spacing:.9em;filter:blur(6px)}to{opacity:1;filter:none}}
@keyframes spLine{to{width:min(260px,60vw)}}
@keyframes spOut{to{opacity:0;visibility:hidden}}

.cfg{display:flex;flex-wrap:wrap;gap:12px;align-items:center;background:linear-gradient(180deg,var(--p2),var(--p));border:1px solid var(--ln);border-radius:14px;padding:12px;margin-bottom:10px;animation:up .35s both}
.cfg .pl{display:flex;align-items:center;gap:8px;min-width:130px}.cfg .its{display:flex;gap:4px;flex:1;flex-wrap:wrap}.cfg .its .ic{height:38px;width:38px;font-size:24px}.cfg .its .ic img,.cfg .its .ic svg{max-height:38px;width:38px;height:38px}
.side{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700;background:#7c6cf033;color:#c9c2ff}.side.tails{background:#4fd1ff22;color:#8fe3ff}
.sd{display:flex;gap:8px}.sd button{flex:1}.sd button.on{outline:2px solid var(--ac2)}
#cfov{position:fixed;inset:0;z-index:900;background:#05060acc;backdrop-filter:blur(6px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;animation:fade .25s both}
.coins{display:flex;gap:26px;perspective:900px;margin:60px 0 6px}.coin{width:96px;height:96px;position:relative;transform-style:preserve-3d}
.coin div{position:absolute;inset:0;border-radius:50%;display:flex;align-items:center;justify-content:center;backface-visibility:hidden;font:700 46px/1 'Syncopate','Eurostile',system-ui,sans-serif;color:#fff;text-indent:.05em}
.coin .h{background:radial-gradient(circle at 30% 28%,#6cc3ff,#1d6fe0 60%,#0d3a85);border:4px solid #bfe3ff;box-shadow:0 0 26px #2f8cff99,inset 0 0 14px #0a2a6688;text-shadow:0 2px 6px #0a2a66}
.coin .t{transform:rotateY(180deg);background:radial-gradient(circle at 30% 28%,#ff8a8a,#e0262d 60%,#85101a);border:4px solid #ffd0d0;box-shadow:0 0 26px #ff4a4a99,inset 0 0 14px #66080e88;text-shadow:0 2px 6px #66080e}
.cflogo{width:84px;height:84px;object-fit:contain;filter:drop-shadow(0 0 18px #7c6cf0cc)}
.tally{font:700 14px 'Syncopate',system-ui,sans-serif;letter-spacing:.2em;color:var(--m);min-height:18px}.tally b{color:#fff}
.cfres{opacity:0;transform:scale(.7);transition:opacity .4s,transform .4s cubic-bezier(.2,.8,.2,1);text-align:center}.cfres.show{opacity:1;transform:none}
.cfres .big{font:700 38px/1.1 'Syncopate',system-ui,sans-serif;letter-spacing:.14em;text-indent:.14em}.cfres.win .big{color:#4ade80;text-shadow:0 0 28px #4ade8099}.cfres.lose .big{color:#f87171;text-shadow:0 0 28px #f8717199}
.cfres small{display:block;margin-top:8px;color:var(--m);font-size:14px}
.sd button.hd{border-color:#2f8cff66}.sd button.tl{border-color:#ff4a4a66}
@keyframes cflip{0%{transform:translateY(0) rotateY(0)}45%{transform:translateY(var(--up)) rotateY(calc(var(--rf)*.55))}100%{transform:translateY(0) rotateY(var(--rf))}}
#cfov h2{margin:0;font:700 18px 'Syncopate',system-ui,sans-serif;letter-spacing:.2em;text-indent:.2em;text-align:center}
#rainbox{padding:10px 12px;border-bottom:1px solid var(--ln);background:linear-gradient(135deg,#142238,#17122e);font-size:13px}
#rainbox .rt{font-weight:700;display:flex;justify-content:space-between;gap:8px;align-items:center}#rainbox .rs{color:var(--m);font-size:12px;margin-top:3px}
#rainbox .rt small{color:#7dd3fc;font-weight:700;white-space:nowrap}#rcd{color:#fff;font-variant-numeric:tabular-nums}
#rainbox.open{background:linear-gradient(135deg,#0f3a4d,#1d1646);box-shadow:inset 0 0 24px #4fd1ff22}
#rainbox .rq{display:flex;gap:6px;align-items:center;margin-top:8px}#rainbox .rq b{font-size:16px;white-space:nowrap}#rainbox .rq input{flex:1;min-width:0;padding:7px 9px}#rainbox .rq button,#rainbox>button{padding:7px 12px}
#rainbox>button{margin-top:8px;width:100%}
.cmsg.sys{background:#4fd1ff14;border:1px solid #4fd1ff33;border-radius:10px;padding:6px 8px;color:#bfe9ff}
#chatmsgs{min-height:120px}
#rainov{position:fixed;inset:0;z-index:950;background:#05060acc;backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:16px;animation:fade .2s both}
#rainov .rbox{width:min(340px,100%);background:linear-gradient(135deg,#0f3a4d,#1d1646);border:1px solid #4fd1ff44;border-radius:18px;padding:22px;text-align:center;box-shadow:0 0 40px #4fd1ff22;animation:spinIn .25s both;display:flex;flex-direction:column;gap:12px}
#rainov .rtt{font:700 16px 'Syncopate',system-ui,sans-serif;letter-spacing:.18em}#rainov .rmuted{color:var(--m);font-size:13px}
#rainov .rbig{font:700 36px/1.1 'Syncopate',system-ui,sans-serif}#rainov input{text-align:center;font-size:18px}
/* coinflip v2 */
.cfx{display:grid;grid-template-columns:1fr;gap:14px;align-items:start}@media(min-width:900px){.cfx{grid-template-columns:420px 1fr}}
.sdr{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.sdc{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;border:2px solid #2c3140;background:#12141a;color:var(--t);box-shadow:none;text-align:left;font-weight:700}
.sdc:hover:not(:disabled){transform:none;box-shadow:none;background:#181b23}.sdc small{display:block;color:var(--m);font-weight:500}
.sdc.h.on{border-color:#4aa8ff;background:#0f2038;box-shadow:0 0 22px -6px #2f8cffaa}.sdc.t.on{border-color:#ff6b6b;background:#2b1216;box-shadow:0 0 22px -6px #ff4a4aaa}
.mc{width:40px;height:40px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font:700 18px/1 'Syncopate',system-ui,sans-serif;color:#fff;flex:none}
.mc.h{background:radial-gradient(circle at 30% 28%,#6cc3ff,#1d6fe0 60%,#0d3a85);border:2px solid #bfe3ff}.mc.t{background:radial-gradient(circle at 30% 28%,#ff8a8a,#e0262d 60%,#85101a);border:2px solid #ffd0d0}
.offer{background:#0d0f14;border:1px dashed #3a4156;border-radius:14px;padding:10px 12px;margin-bottom:12px}.offer .oh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px;min-height:30px;align-items:center}.chp{display:inline-flex;align-items:center;gap:6px;background:#1c2030;border:1px solid #343b50;border-radius:99px;padding:3px 10px 3px 4px;cursor:pointer;font-size:12px}
.chp .ic{height:26px;width:26px;font-size:16px}.chp .ic img,.chp .ic svg{width:26px;height:26px;max-height:26px}.chp:hover{border-color:var(--r)}
.pkg{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px;max-height:340px;overflow-y:auto;padding:2px}
.pk{position:relative;background:linear-gradient(180deg,#232838,#191c27);border:1px solid #333a4e;border-radius:12px;padding:8px 4px 6px;text-align:center;cursor:pointer;transition:transform .12s,border-color .15s}
.pk:hover{transform:translateY(-2px);border-color:#7c6cf0}.pk.on{border-color:var(--g);box-shadow:0 0 0 1px var(--g),0 0 14px -4px #4ade8077;background:linear-gradient(180deg,#1d3328,#162219)}
.pk .ic{height:52px;font-size:34px}.pk .ic img,.pk .ic svg{max-height:52px;height:52px;width:auto;max-width:100%}.pk b{display:block;font-size:11px;margin:2px 0;line-height:1.2;min-height:26px;display:flex;align-items:center;justify-content:center}.pk small{color:var(--g);font-size:11px}
.pk .pkq{position:absolute;top:4px;right:6px;font-size:10px;color:var(--m);background:#0008;border-radius:8px;padding:1px 5px}.pk.on .pkq{color:#fff;background:#16a34a}
.gm{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:linear-gradient(180deg,#1e2230,#161922);border:1px solid #2f3547;border-radius:16px;padding:12px;margin-bottom:10px;animation:up .35s both}
.gm.mine{border-color:#7c6cf066}.gm .who{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-weight:700}.gm .who img{width:24px;height:24px}
.gm .its{display:flex;gap:6px;flex-wrap:wrap}.gm .it{position:relative;background:#0d0f14;border:1px solid #2c3345;border-radius:10px;padding:2px}.gm .it .ic{height:46px;width:46px;font-size:28px}.gm .it .ic img,.gm .it .ic svg{width:46px;height:46px;max-height:46px}
.gm .it span{position:absolute;right:2px;bottom:0;font-size:10px;font-weight:700;background:#000a;border-radius:6px;padding:0 4px}
.gm .rt{text-align:right}.gm .rt b{font-size:17px}.gm .rt small{display:block;color:var(--m);margin:2px 0 6px}
.gm .mc{width:48px;height:48px;font-size:22px}
@media(max-width:520px){.gm{grid-template-columns:auto 1fr}.gm .rt{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;text-align:left}.gm .rt small{margin:0}}

<script>window.onerror=function(m,u,l){document.body.insertAdjacentHTML('afterbegin','<pre style="color:#f87171;padding:12px;white-space:pre-wrap;font-size:12px">JS error: '+m+' (line '+l+')</pre>')};window.onunhandledrejection=function(e){document.body.insertAdjacentHTML('afterbegin','<pre style="color:#f87171;padding:12px;white-space:pre-wrap;font-size:12px">Error: '+(e.reason&&e.reason.message||e.reason)+'</pre>')}</script>
<script>
const $=s=>document.querySelector(s),fmt=n=>Math.floor(n).toLocaleString();
let S=null,tab='home',q='',sel={},mres=null,mlast=-1,seen=0,pend=null,nav=0,mbet=10,mmn=3,mbusy=false,cfg=JSON.parse(localStorage.cfg||'{"anim":true,"hide":false}');
let chatOpen=false,chatSeen=0;
const NAV=[['home','🏠','Home'],['values','📈','Values'],['inventory','🎒','Inventory'],['exchange','🔄','Exchange'],['jackpot','🎰','Jackpot'],['coinflip','🪙','Coinflip'],['mines','💣','Mines'],['withdraw','📤','Withdraw'],['deposit','💳','Deposit'],['leaderboard','🏆','Leaderboard'],['settings','⚙️','Settings'],['admin','🛠️','Admin']];
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._);t._=setTimeout(()=>t.style.display='none',2500)};
const api=async(a,b={})=>{try{const r=await fetch('/api/'+a,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b)});const j=await r.json();if(j.error)toast(j.error);return j}catch{toast('Network error');return{}}};
// Splash: logo + title, then fades out. Used on site entry and when opening a game.
const GAMES=['mines','jackpot','coinflip'];
function splash(text,ms=1700){const old=$('#splash');if(old)old.remove();if(!cfg.anim)return;
 const d=document.createElement('div');d.id='splash';d.innerHTML=`<img src="/logo.png" alt=""><b>${text}</b><i></i>`;document.body.appendChild(d);setTimeout(()=>d.remove(),ms)}
{const s=document.querySelector('#splash');if(s){if(!cfg.anim)s.remove();else setTimeout(()=>s.remove(),1800)}}
const emojiSpan=e=>{const s=document.createElement('span');s.textContent=e;return s};
// Icon chain: /icons/<id>.png (your own file) -> MM2 wiki image by item name -> emoji
const wikiImg=n=>'https://murder-mystery-2.fandom.com/wiki/Special:FilePath/'+encodeURIComponent(n.replace(/ /g,'_'))+'.png';
const hh=s=>{let x=0;for(const c of s)x=(x*31+c.charCodeAt(0))%360;return x};
// Drawn icon (used when no PNG / wiki image loads): gun or knife silhouette coloured by rarity + item
function icSvg(d){const t=d.type,r=d.rar,id=d.id,H=hh(id),H2=(H+50)%360;
 if(t==='pet')return `<span>${d.emoji}</span>`;
 const g=r==='chroma'?['#ff4d6d','#ffd23f','#3ddc97','#4fb3ff','#b47cff']:r==='ancient'?['#fff1b8','#e9b949','#a66a12']:r==='unique'?['#ffb3b3','#e03a3a','#6b0f1a']:[`hsl(${H} 85% 72%)`,`hsl(${H} 75% 55%)`,`hsl(${H2} 70% 38%)`];
 const stops=g.map((c,i)=>`<stop offset="${i/(g.length-1)*100}%" stop-color="${c}"/>`).join('');
 const gl=r==='chroma'?'#ffffff88':r==='ancient'?'#e9b949aa':`hsl(${H} 90% 60% / .55)`;
 const body=t==='gun'
 ?`<path d="M6 21h40l6 4v8H31l-3 4h-5l1-4H15l-3 17H5l4-17H6z" fill="url(#g${id})" stroke="#0007" stroke-width="1.5" stroke-linejoin="round"/><rect x="8" y="23" width="30" height="3" rx="1.5" fill="#fff6"/><circle cx="42" cy="29" r="2" fill="#0006"/>`
 :`<path d="M26 36 61 5c-1 14-9 27-23 35z" fill="url(#g${id})" stroke="#0007" stroke-width="1.5" stroke-linejoin="round"/><path d="M30 35 56 9" stroke="#fff8" stroke-width="1.6" stroke-linecap="round"/><path d="M21 31l15 15" stroke="#2a2d36" stroke-width="5" stroke-linecap="round"/><path d="M26 41 8 59" stroke="url(#g${id})" stroke-width="7" stroke-linecap="round"/><path d="M26 41 8 59" stroke="#0004" stroke-width="2" stroke-dasharray="2 5" stroke-linecap="round"/>`;
 return `<svg viewBox="0 0 64 64" width="64" height="64" style="filter:drop-shadow(0 0 7px ${gl})"><defs><linearGradient id="g${id}" x1="0" y1="0" x2="1" y2="1">${stops}</linearGradient></defs>${body}</svg>`}
window._icFallback=function(img){const d=img.dataset;
 if(d.stage==='0'&&d.wiki){d.stage='1';img.src=d.wiki;return}
 img.outerHTML=icSvg(d)};
const ic=i=>/^(https?:)?\//.test(i.icon)?`<img src="${i.icon}" loading="lazy" alt="">`:`<img src="/icons/${i.id}.png" loading="lazy" alt="${i.name}" data-stage="0" data-wiki="${i.type==='pet'?'':wikiImg(i.name)}" data-emoji="${i.icon}" data-type="${i.type}" data-rar="${i.rarity||''}" data-id="${i.id}" onerror="_icFallback(this)">`;
const card=(i,x='',c='',o='')=>`<div class="card ${c}" ${o}><div class="ic">${ic(i)}</div><b>${i.name}</b><small>${fmt(i.value)}</small>${x}</div>`;
const byId=id=>S.items.find(i=>i.id===id),mlt=(m,n)=>{let x=.97;for(let k=0;k<n;k++)x*=(25-k)/(25-m-k);return x};
const hue=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))%360;return `hsl(${h} 65% 60%)`};
async function load(){S=await api('state');if(S.rain)rainSkew=S.rain.now-Date.now();document.body.className=cfg.anim?'':'noanim';if(S.error||(!S.guest&&!S.me)){if(!S.me&&!$('#view'))$('#app').innerHTML='<pre style="color:#f87171;padding:14px;white-space:pre-wrap">Server error: '+(S.error||'no response')+'</pre>';return}if(S.guest){if(!$('#lg'))login();return}if(!$('#view'))shell();head();if(tab==='jackpot')jpUpdate();cfWatch();if(tab==='home'&&$('#view')&&$('#view').firstElementChild)rHome($('#view'));chatTick()}
let tick=0;setInterval(()=>{if(document.hidden||pend||(S&&S.guest))return;if(tab!=='jackpot'&&tab!=='coinflip'&&++tick%6)return;load()},1500);
function login(){if($('#un'))return;$('#app').innerHTML=`<main><div class="box" style="max-width:420px;margin:60px auto"><div class="logo" style="font-size:30px;justify-content:center"><img src="/logo.png" alt="" style="width:44px;height:44px"><span>Sync MM2</span></div><p class="muted">Verify your Roblox account to play.</p><div id="lg"><input id="un" placeholder="Roblox username" style="width:100%;margin-bottom:10px"><button class="big" style="margin:0" onclick="vstart()">Get verification code</button></div><p class="muted" style="font-size:11px;margin-top:14px">We log basic device/network info to prevent multi-accounting and abuse.</p></div></main>`}
async function vstart(){const r=await api('start',{username:$('#un').value});if(!r.code)return;pend=r;
 $('#lg').innerHTML=`<p>Paste this into your <b>Roblox bio (About)</b> within 10 minutes:</p><div class="box" style="background:var(--p2);user-select:all;font-weight:700">${r.code}</div><p class="muted" id="cd"></p><button class="s" onclick="navigator.clipboard.writeText('${r.code}');toast('Copied')">Copy code</button>`;
 const t=setInterval(async()=>{if(!pend)return clearInterval(t);const s=Math.max(0,Math.round((r.exp-Date.now())/1000));$('#cd').textContent=`Waiting for bio… expires in ${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
  if(s%3===0){const c=await api('check',{tok:r.tok});if(c.ok){pend=null;clearInterval(t);load()}else if(c.error){pend=null;clearInterval(t);$('#app').innerHTML='';login()}}},1000)}
function shell(){const m=S.me;$('#app').innerHTML=`<aside id="sb"><div class="logo"><img src="/logo.png" alt=""><span>Sync MM2</span></div><div class="uc"><img class="av" src="${m.avatar}" alt=""><div><b>${m.name}</b><span class="tok" id="sbt"></span></div></div><div id="nv">${NAV.filter(n=>n[0]!=='admin'||m.admin).map(n=>`<button id="t_${n[0]}" onclick="go('${n[0]}')"><span>${n[1]}</span>${n[2]}</button>`).join('')}</div></aside><div id="ov" onclick="sb(0)"></div><div id="mn"><div class="top"><button class="s mb" onclick="sb(1)">☰</button><b id="tt"></b><span class="tok" id="hd"></span></div><main id="view"></main></div><button id="chatbtn" onclick="chatToggle()">💬</button><div id="chatpanel"></div>`;go(tab)}
const sb=o=>{$('#sb').classList.toggle('open',!!o);$('#ov').classList.toggle('show',!!o)};
function head(){const t=cfg.hide?'••••':fmt(S.me.tokens);if($('#hd'))$('#hd').textContent='🪙 '+t;if($('#sbt'))$('#sbt').textContent='🪙 '+t}
function go(t){const was=tab;tab=t;sel={};q='';sb(0);const n=NAV.find(x=>x[0]===t);if(GAMES.includes(t)&&was!==t)splash(n[2]);document.querySelectorAll('#nv button').forEach(b=>b.classList.toggle('on',b.id==='t_'+t));$('#tt').textContent=n[2];const my=++nav;
 $('#view').innerHTML=`<div class="ld"><div class="sp"></div><span class="muted">Loading ${n[2]}…</span></div>`;
 setTimeout(async()=>{if(my!==nav)return;await load();if(my===nav)render()},cfg.anim?550:0)}
const render=()=>{({home:rHome,values:rValues,inventory:rInv,exchange:rEx,jackpot:rJP,coinflip:rCf,mines:rMines,withdraw:rWd,deposit:rDep,leaderboard:rLb,settings:rSet,admin:rAdm})[tab]($('#view'))};
function srch(f){return`<input placeholder="Search items…" value="${q}" oninput="q=this.value;${f}()" style="width:100%;margin-bottom:12px">`}
const filt=l=>l.filter(i=>i.name.toLowerCase().includes(q.toLowerCase()));
function rValues(v){v.innerHTML=`<div class="box"><h3>Values of Items</h3>${srch('vl')}<div class="grid" id="g"></div></div>`;vl()}
function vl(){$('#g').innerHTML=filt([...S.items].sort((a,b)=>b.value-a.value)).map(i=>card(i)).join('')}
function rHome(v){const on=S.online||[],am=S.activeMines||[],j=S.jp;
 v.innerHTML=`<div class="box"><h3>🟢 Online now <span class="muted">(${on.length})</span></h3><div class="grid">${on.map(u=>`<div class="card"><div class="ic"><img class="av" style="width:40px;height:40px" src="${u.avatar}" alt=""></div><b>${u.name}</b></div>`).join('')||'<p class="muted">Just you.</p>'}</div></div>
<div class="box"><h3>🎲 Active games</h3><div class="stat"><span>🎰 Jackpot</span><b>${j.players.length?fmt(j.total)+' value · '+j.players.length+' players':'No one playing'}</b></div>
${am.length?am.map(x=>`<div class="stat"><span><img class="av" src="${x.avatar}" alt="">${x.name} — Mines</span><b>${x.open}/${25-x.m} tiles · bet ${fmt(x.bet)}🪙</b></div>`).join(''):'<div class="stat"><span>💣 Mines</span><b class="muted">No one playing</b></div>'}</div>`}
const owned=()=>S.items.filter(i=>S.me.inv[i.id]).map(i=>({...i,q:S.me.inv[i.id]}));
function pick(id){sel[id]=(sel[id]||0)+1;if(sel[id]>(S.me.inv[id]||0))delete sel[id];render()}
const selCard=i=>card(i,`<small class="muted"> ${sel[i.id]?sel[i.id]+'/':'x'}${i.q}</small>`,sel[i.id]?'sel':'',`onclick="pick('${i.id}')"`);
const selVal=()=>Object.entries(sel).reduce((s,[k,n])=>s+byId(k).value*n,0);
function rInv(v){v.innerHTML=`<div class="box"><h3>Inventory</h3><div class="stat"><span>Total item value</span><b>${fmt(S.me.invValue)}</b></div><div class="stat"><span>Tokens</span><b class="tok">${fmt(S.me.tokens)}</b></div></div><div class="grid">${owned().map(i=>card(i,` <small class="muted">x${i.q}</small>`)).join('')||'<p class="muted">Empty.</p>'}</div>`}
function rEx(v){v.innerHTML=`<div class="box"><h3>Sell items <span class="muted">— 90% in tokens</span></h3><div class="grid">${owned().map(i=>card(i,`<small class="muted"> x${i.q} · ${fmt(i.value*.9)}🪙</small><button style="width:100%;margin-top:6px" onclick="sell('${i.id}')">Sell 1</button>`)).join('')||'<p class="muted">Nothing to sell.</p>'}</div></div>
<div class="box"><h3>Shop <span class="muted">— 110%</span></h3><div class="grid">${S.items.filter(i=>S.shop[i.id]).map(i=>card(i,`<small class="muted"> stock ${S.shop[i.id]} · ${fmt(Math.ceil(i.value*1.1))}🪙</small><button style="width:100%;margin-top:6px" onclick="buy('${i.id}')">Buy 1</button>`)).join('')||'<p class="muted">Shop is empty.</p>'}</div></div>`}
async function sell(id){await api('sell',{item:id,qty:1});await load();if(tab==='exchange')render()}async function buy(id){await api('buy',{item:id,qty:1});await load();if(tab==='exchange')render()}
function rJP(v){v.innerHTML=`<div class="box"><h3>Jackpot <span class="muted">— items only · 10% tax</span></h3><div class="ptr"></div><div id="wheel"></div><p id="jt" style="text-align:center"></p><div id="jr" style="text-align:center;font-weight:700"></div><div id="jl"></div></div>
<div class="box"><h3>Select items to join</h3><p>Selected value: <b>${fmt(selVal())}</b></p><div class="grid">${owned().map(selCard).join('')}</div><div class="row"><button onclick="jpj()">Join jackpot</button><button class="s" onclick="jpl()">Leave (if alone)</button></div></div>`;wheelSig='';jpUpdate()}
async function jpj(){if((await api('jpjoin',{items:sel})).ok)sel={};await load();if(tab==='jackpot')render()}async function jpl(){await api('jpleave');await load();if(tab==='jackpot')render()}
let wheelSig='',spinning=false;
function jpUpdate(){const j=S.jp,w=$('#wheel');if(!w)return;const sig=j.players.map(p=>p.id+p.value).join();
 if(sig!==wheelSig){wheelSig=sig;let a=0;const st=j.players.map(p=>{const s=`${hue(p.id)} ${a}% ${a+p.pct}%`;a+=p.pct;return s});
  if(!spinning)w.style.background=st.length?`conic-gradient(${st.join(',')})`:'var(--p2)';
  $('#jl').innerHTML=`<table>${j.players.map(p=>`<tr><td><img class="av" src="${p.avatar}" alt=""><span style="color:${hue(p.id)}">${p.name}</span></td><td>${fmt(p.value)}</td><td>${p.pct.toFixed(1)}%</td></tr>`).join('')}</table>`}
 const left=j.end?Math.max(0,Math.ceil((j.end-j.now)/1000)):0;$('#jt').textContent=j.players.length<2?'Waiting for 2+ players…':`Spinning in ${left}s · Pot ${fmt(j.total)}`;
 const l=j.last;if(l&&l.rid!==seen){const fresh=(j.now-l.t)<12000;seen=l.rid;if(fresh)spin(l)}}
function spin(l){const w=$('#wheel');if(!w)return;spinning=true;let a=0,c=0;const t=l.snap.reduce((s,p)=>s+p.value,0);
 const st=l.snap.map(p=>{const pc=p.value/t*100;if(p.id===l.winner)c=(a+pc/2)*3.6;const s=`${hue(p.id)} ${a}% ${a+pc}%`;a+=pc;return s});
 w.style.transition='none';w.style.transform='rotate(0)';w.style.background=`conic-gradient(${st.join(',')})`;w.offsetWidth;
 w.style.transition=cfg.anim?'transform 5s cubic-bezier(.12,.7,.1,1)':'none';w.style.transform=`rotate(${360*6-c}deg)`;
 setTimeout(()=>{const r=$('#jr');if(r)r.innerHTML=`🏆 ${l.name} won ${fmt(l.total-l.taxed)} value! <span class="muted">(tax ${fmt(l.taxed)})</span>`;spinning=false;wheelSig='';load()},cfg.anim?5200:0)}
const rr=()=>{if(tab==='mines')rMines($('#view'))};
const GEM='<svg viewBox="0 0 64 64"><path d="M32 6 54 24 32 58 10 24z" fill="#b8ffd9" stroke="#fff" stroke-width="2.5" stroke-linejoin="round"/><path d="M10 24h44M22 24 32 6l10 18M22 24l10 34 10-34" fill="none" stroke="#2fb36e" stroke-width="2"/></svg>';
const BOMB='<svg viewBox="0 0 64 64"><circle cx="30" cy="38" r="20" fill="#1b1b22" stroke="#fff" stroke-width="2.5"/><path d="M43 22l7-7M52 8l2 6 6 2" fill="none" stroke="#ffd166" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="23" cy="31" r="5" fill="#fff" opacity=".5"/></svg>';
const chip=(l,v,c='')=>`<div class="mchip ${c}"><small>${l}</small><b>${v}</b></div>`;
function rMines(v){const g=S.mines,r=mres,n=g?g.open.length:0,m=g?g.m:mmn,cur=g?g.mult:1,left=25-m-n;
 const chips=g?chip('Multiplier',cur.toFixed(2)+'x','hl')+chip('Payout',fmt(g.bet*cur),'hl')+chip('Next tile',mlt(m,n+1).toFixed(2)+'x')+chip('Gems left',left+' / '+(25-m))
  :chip('Mines',mmn)+chip('Gems',25-mmn)+chip('First tile',mlt(mmn,1).toFixed(2)+'x','hl')+chip('Max win',mlt(mmn,25-mmn).toFixed(2)+'x');
 const setup=g?`<div class="stat"><span>Bet</span><b>${fmt(g.bet)} 🪙</b></div><div class="stat"><span>Mines</span><b>${g.m} 💣</b></div><div class="stat"><span>Safe chance next</span><b>${(left/(25-n)*100).toFixed(1)}%</b></div><button class="big cashbtn" onclick="mca()" ${n?'':'disabled'}>${n?'Cash out '+fmt(g.bet*cur)+' 🪙':'Pick a tile first'}</button>`
 :`<label class="lb">Bet amount <span class="muted" style="text-transform:none">(min 5)</span></label><div class="row"><input id="mb" type="number" min="5" value="${mbet}" oninput="mbet=+this.value" style="flex:1;min-width:90px"><button class="s" onclick="mset(.5)">½</button><button class="s" onclick="mset(2)">2×</button><button class="s" onclick="mset(0)">Max</button></div>
 <div class="row">${[5,10,50,100,500,1000].map(x=>`<button class="s ${mbet===x?'on':''}" onclick="mbet=${x};rr()">${x}</button>`).join('')}</div>
 <label class="lb">Mines <span class="muted" style="text-transform:none">(1–24)</span>: <b id="mc" style="color:var(--t);font-size:15px">${mmn}</b></label>
 <input type="range" min="1" max="24" value="${mmn}" oninput="mmn=+this.value;$('#mc').textContent=mmn;$('#pv').textContent=mlt(mmn,1).toFixed(2)+'x'" onchange="rr()" style="width:100%">
 <div class="row">${[1,3,5,10,15,20,24].map(x=>`<button class="s ${mmn===x?'on':''}" onclick="mmn=${x};rr()">${x}</button>`).join('')}</div>
 <div class="stat"><span>First tile pays</span><b class="g" id="pv">${mlt(mmn,1).toFixed(2)}x</b></div><div class="stat"><span>Your balance</span><b class="tok">${fmt(S.me.tokens)} 🪙</b></div><button class="big" onclick="mst()" ${mbusy?'disabled':''}>${mbusy?'Placing mines…':'Start game'}</button>`;
 const op=g?g.open:r?r.open:[];
 const tiles=Array.from({length:25},(_,i)=>{const o=op.includes(i),b=!g&&r&&r.mines&&r.mines.includes(i),hit=b&&r.boom&&i===mlast;
  return`<button class="mt ${o?'gem':b?'bomb'+(hit?' hit':r.boom?'':' dim'):''}" ${g&&!o&&!mbusy?`onclick="mp(${i})"`:'disabled'} aria-label="tile ${i+1}">${o?GEM:b?BOMB:''}</button>`}).join('');
 const msg=!g&&r?(r.boom?`<div class="mres lose">💥 Boom!<small>You lost your bet</small></div>`:`<div class="mres win">Cashed out +${fmt(r.cashed)} 🪙<small>${(r.open||[]).length} gems collected</small></div>`):'';
 v.innerHTML=`<div class="mw"><div class="box mctl"><h3>💣 Mines <span class="muted">— 5×5 · tokens only</span></h3>${setup}</div><div class="mstage"><div class="mchips">${chips}</div><div class="mgrid ${mbusy?'pls':''}">${tiles}</div>${msg}</div></div>`}
function mset(x){mbet=x?Math.max(5,Math.floor(mbet*x)):Math.max(5,Math.floor(S.me.tokens));rr()}
async function mst(){if(mbusy)return;if(!(mbet>=5)){toast('Minimum bet is 5');return}mres=null;mbusy=true;rr();await new Promise(r=>setTimeout(r,cfg.anim?700:0));await api('minesstart',{bet:mbet,m:mmn});mbusy=false;await load();rr()}
async function mp(i){mlast=i;const r=await api('minespick',{i});if(r.boom)mres=r;else if(r.cashed!=null)mres=r;await load();rr()}
async function mca(){const r=await api('minescash');if(r.cashed!=null)mres=r;await load();rr()}
function rWd(v){const wl=owned().filter(i=>['gun','knife'].includes(i.type));v.innerHTML=`<div class="box"><h3>Withdraw <span class="muted">— guns &amp; knives only</span></h3><div class="grid">${wl.map(i=>card(i,`<small class="muted"> x${i.q}</small><button style="width:100%;margin-top:6px" onclick="wd('${i.id}')">Request 1</button>`)).join('')||'<p class="muted">No withdrawable items.</p>'}</div></div>
<div class="box"><h3>Your requests</h3><table>${S.wd.map(w=>`<tr><td>${w.qty}x ${byId(w.item).name}</td><td>${w.status}</td></tr>`).join('')||'<tr><td class="muted">None yet</td></tr>'}</table></div>`}
async function wd(id){await api('withdraw',{item:id,qty:1});toast('Request sent');await load();if(tab==='withdraw')render()}
function rDep(v){v.innerHTML=`<div class="box"><h3>Deposit</h3><p>Join the Discord and open a ticket to deposit manually.</p><a href="https://discord.gg/AFyru7hAnn" target="_blank" rel="noopener"><button class="big">Join Discord</button></a></div>`}
async function rLb(v){const d=await api('lb');const t=(n,l)=>`<div class="box"><h3>${n}</h3><table>${l.map((u,i)=>`<tr><td>${i+1}</td><td><img class="av" src="${u.avatar}" alt="">${u.name}</td><td style="color:${u.v<0?'var(--r)':'var(--g)'}">${fmt(u.v)}</td></tr>`).join('')||'<tr><td class="muted">No data</td></tr>'}</table></div>`;v.innerHTML=t('Top Wagered',d.wagered||[])+t('Top Profit',d.profit||[])}
function rSet(v){v.innerHTML=`<div class="box"><h3>Settings</h3><p><label><input type="checkbox" ${cfg.anim?'checked':''} onchange="sc('anim',this.checked)"> Animations</label></p><p><label><input type="checkbox" ${cfg.hide?'checked':''} onchange="sc('hide',this.checked)"> Hide token balance</label></p><p class="muted">Your Roblox ID: <b style="color:var(--t)">${S.me.id}</b><br>Admin access: add this ID to ADMIN_IDS in Vercel.</p><button class="s" onclick="api('logout').then(()=>location.reload())">Log out</button></div>`}
function sc(k,x){cfg[k]=x;localStorage.cfg=JSON.stringify(cfg);document.body.className=cfg.anim?'':'noanim';head()}
function rAdm(v){const A=S.admin||{wd:[],logs:[],alts:[]},opts=S.items.map(i=>'<option value="'+i.id+'">'+i.name+'</option>').join('');
 const wl=A.wd.map(w=>'<tr><td>'+w.name+'</td><td>'+w.qty+'x '+byId(w.item).name+'</td><td><button data-a="admwd" data-id="'+w.id+'" data-ok="1">Approve</button> <button class="s" data-a="admwd" data-id="'+w.id+'" data-ok="0">Reject</button></td></tr>').join('')||'<tr><td class="muted">None pending</td></tr>';
 v.innerHTML='<div class="box"><h3>Items and tokens</h3><div class="row"><input id="au" placeholder="Username or ID"><select id="ai">'+opts+'</select><input id="aq" type="number" placeholder="Qty / amount / value" style="width:160px"></div>'
 +'<div class="row"><button data-a="admgive">Give item</button><button data-a="admset">Set qty</button><button data-a="admtokens">Add tokens</button><button data-a="admvalue">Set item value</button></div></div>'
 +'<div class="box"><h3>Games</h3><div class="row"><button data-a="admcanceljp">Cancel jackpot</button><button data-a="admcancelmines">Cancel users mines</button></div></div>'
 +'<div class="box"><h3>Withdrawals</h3><table>'+wl+'</table></div>'
 +'<div class="box"><h3>Possible alt accounts <span class="muted">— same device</span></h3><table>'+((A.alts&&A.alts.length)?A.alts.map(g=>'<tr><td>'+g.join(', ')+'</td></tr>').join(''):'<tr><td class="muted">None detected</td></tr>')+'</table></div>'
 +'<div class="box"><h3>Discord webhook '+(A.webhook?'(set)':'(not set)')+'</h3><div class="row"><input id="aw" placeholder="Webhook URL" style="flex:1"><button data-a="admwebhook">Save</button></div></div>';
 v.onclick=e=>{const b=e.target.closest('button[data-a]');if(!b)return;const a=b.dataset.a;
  if(a==='admcanceljp')api(a).then(load);else if(a==='admwd')aw(b.dataset.id,+b.dataset.ok);
  else if(a==='admwebhook')api(a,{url:$('#aw').value}).then(()=>toast('Saved'));else ad(a)}}
async function ad(a){const b={user:$('#au').value,item:$('#ai').value,qty:$('#aq').value,amount:$('#aq').value,value:$('#aq').value};if((await api(a,b)).ok)toast('Done');await load()}
async function aw(id,ok){await api('admwd',{id,ok});await load();if(tab==='admin')render()}
function chatToggle(){chatOpen=!chatOpen;const p=$('#chatpanel'),b=$('#chatbtn');if(!p)return;p.classList.toggle('open',chatOpen);if(chatOpen){if(b)b.classList.remove('alert');chatRender()}}
function chatRender(){const p=$('#chatpanel');if(!p)return;const c=S.chat||[];chatSeen=c.length?c[c.length-1].id:0;
 if(!$('#chatmsgs')){p.innerHTML=`<div style="padding:10px 12px;border-bottom:1px solid var(--ln);font-weight:700">Site chat</div><div id="rainbox"></div><div id="chatmsgs"></div><div id="chatin"><input id="cmi" placeholder="Message…" onkeydown="if(event.key==='Enter')chatSend()"><button onclick="chatSend()">Send</button></div>`;rainKey=''}
 const box=$('#chatmsgs'),bot=box.scrollHeight-box.scrollTop-box.clientHeight<40||!box.dataset.n;
 box.innerHTML=c.map(m=>m.sys?`<div class="cmsg sys">${m.msg.replace(/</g,'&lt;')}</div>`:`<div class="cmsg"><b>${m.name}:</b> ${m.msg.replace(/</g,'&lt;')}</div>`).join('')||'<p class="muted">No messages yet.</p>';
 box.dataset.n=1;if(bot)box.scrollTop=box.scrollHeight;rainRender()}
async function chatSend(){const i=$('#cmi');if(!i||!i.value.trim())return;i.disabled=true;await api('chatsend',{msg:i.value});i.value='';i.disabled=false;await load();if(chatOpen)chatRender();const ni=$('#cmi');if(ni)ni.focus()}
function chatTick(){const c=S.chat||[],btn=$('#chatbtn');if(!btn)return;if(chatOpen)chatRender();else if(c.length&&c[c.length-1].id!==chatSeen)btn.classList.add('alert')}

// ---- Sync Rain panel (top of the chat) ----
const RH=3600000,ROPEN=55*60000;let rainSkew=0,rainQ=null,rainKey='',rainWasOpen=null;
const rainNow=()=>Date.now()+rainSkew,rainPhase=()=>{const m=rainNow()%RH;return m>=ROPEN?{open:true,left:RH-m}:{open:false,left:ROPEN-m}};
const mmss=ms=>{const s=Math.max(0,Math.ceil(ms/1000)),m=Math.floor(s/60);return m+':'+String(s%60).padStart(2,'0')};
function rainCd(){const e=$('#rcd');if(e)e.textContent=mmss(rainPhase().left)}
function rainRender(){const b=$('#rainbox');if(!b||!S.rain)return;const r=S.rain,ph=rainPhase(),me=r.me||{};if(!ph.open){rainQ=null;rainClose()}
 const key=[ph.open,me.in].join('|');
 if(key!==rainKey){rainKey=key;b.className=ph.open?'open':'';let body;
  if(!ph.open)body=`<div class="rs">Starts in <b id="rcd"></b> — chat once this hour to be able to join</div>`;
  else if(me.in)body=`<div class="rs">✅ You're in the rain! <span id="rjn">${r.joined}</span> joined · pays out in <b id="rcd"></b></div>`;
  else body=`<div class="rs">Rain is open! Closes in <b id="rcd"></b> · <span id="rjn">${r.joined}</span> joined</div><button onclick="rainAsk()">Join the rain</button>`;
  b.innerHTML=`<div class="rt"><span>🌧️ Join The Sync Rainpool</span><small>${r.pool||100} tokens rain</small></div>`+body;}
 const j=$('#rjn');if(j)j.textContent=r.joined;rainCd()}
function rainClose(){const m=$('#rainov');if(m)m.remove()}
function rainModal(wrong){rainClose();const m=document.createElement('div');m.id='rainov';
 m.innerHTML=`<div class="rbox"><div class="rtt">🌧️ Sync Rain</div><div class="rmuted">${wrong?'Wrong answer — try this one':'Solve this to join the rain'}</div><div class="rbig">${rainQ} = ?</div><input id="rai" type="number" inputmode="numeric" placeholder="Your answer" onkeydown="if(event.key==='Enter')rainJoin()"><div class="row" style="justify-content:center"><button onclick="rainJoin()">Enter</button><button class="s" onclick="rainClose()">Cancel</button></div></div>`;
 m.onclick=e=>{if(e.target===m)rainClose()};document.body.appendChild(m);$('#rai').focus()}
async function rainAsk(wrong){const r=await api('rainq');if(r.q){rainQ=r.q;rainModal(wrong===true)}await load()}
async function rainJoin(){const i=$('#rai');if(!i||!i.value.trim())return;const r=await api('rainjoin',{ans:i.value});if(r.ok){rainQ=null;rainClose();toast('You joined the rain! 🌧️')}else if(r.error==='Wrong answer'){rainAsk(true);return}else rainClose();await load();if(chatOpen)chatRender()}
setInterval(()=>{const o=rainPhase().open;if(rainWasOpen!==null&&o!==rainWasOpen&&S&&!S.guest){const bt=$('#chatbtn');if(o&&bt&&!chatOpen)bt.classList.add('alert');load()}rainWasOpen=o;rainCd();rainRender()},1000);

// ---- Coinflip ----
let cfSeen=null,cfSide='heads';
const cfRange=v=>[Math.ceil(v*.9),Math.floor(v*1.1)];
const cfItems=its=>Object.entries(its).map(([k,q])=>{const i=byId(k);return i?`<div class="it" title="${i.name} · ${fmt(i.value)}"><div class="ic">${ic(i)}</div><span>x${q}</span></div>`:''}).join('');
const coinM=s=>`<span class="mc ${s==='heads'?'h':'t'}">${s==='heads'?'H':'T'}</span>`;
function cfGameRow(g){const mine=g.c.id===S.me.id,[lo,hi]=cfRange(g.value),sv=selVal(),ok=sv>=lo&&sv<=hi,oppo=g.side==='heads'?'tails':'heads';
 const btn=mine?`<button class="s" onclick="cfCancel(${g.id})">Cancel</button>`:`<button ${ok?'':'disabled'} onclick="cfJoin(${g.id})">${ok?`Join as ${oppo==='heads'?'H':'T'}`:sv?'Out of range':'Select items'}</button>`;
 return `<div class="gm ${mine?'mine':''}">${coinM(g.side)}<div><div class="who"><img class="av" src="${g.c.avatar}" alt="">${g.c.name}${mine?' <span class="muted">(you)</span>':''}</div><div class="its">${cfItems(g.items)}</div></div><div class="rt"><div><b class="g">${fmt(g.value)}</b><small>join with ${fmt(lo)}–${fmt(hi)}</small></div>${btn}</div></div>`}
function cfRecentRow(g){const pn=n=>`<b>${n}</b>`;return `<div class="stat"><span>#${g.id} ${pn(g.c.name)} vs ${pn(g.j.name)}</span><span>${coinM(g.result)} 🏆 ${g.winner.name} <span class="g">+${fmt(g.won)}</span></span></div>`}
const pkCard=i=>`<div class="pk ${sel[i.id]?'on':''}" onclick="pick('${i.id}')"><div class="ic">${ic(i)}</div><b>${i.name}</b><small>${fmt(i.value)}</small><span class="pkq">${sel[i.id]?sel[i.id]+'/'+i.q:'x'+i.q}</span></div>`;
function unpick(id){delete sel[id];render()}
function rCf(v){const own=owned().sort((a,b)=>b.value-a.value),sv=selVal(),chips=Object.entries(sel).map(([k,n])=>{const i=byId(k);return `<span class="chp" onclick="unpick('${k}')" title="Remove"><span class="ic">${ic(i)}</span>${i.name} x${n} ✕</span>`}).join('');
 v.innerHTML=`<div class="cfx"><div class="box"><h3>🪙 Post a coinflip <span class="muted">— 3 coins, best of 3 · 10% tax</span></h3>
 <div class="sdr"><button class="sdc h ${cfSide==='heads'?'on':''}" onclick="cfSide='heads';render()"><span class="mc h">H</span><span>Heads<small>Blue</small></span></button><button class="sdc t ${cfSide==='tails'?'on':''}" onclick="cfSide='tails';render()"><span class="mc t">T</span><span>Tails<small>Red</small></span></button></div>
 <div class="offer"><div class="oh"><span>Your offer</span><b class="g">${fmt(sv)} 🪙</b></div><div class="chips">${chips||'<span class="muted" style="font-size:12px">Tap items below to add them</span>'}</div></div>
 <label class="lb">Your items</label><div class="pkg">${own.map(pkCard).join('')||'<p class="muted">You have no items.</p>'}</div>
 <button class="big" ${sv?'':'disabled'} onclick="cfCreate()">${sv?`Post game · ${cfSide==='heads'?'Heads (H)':'Tails (T)'}`:'Select items to post'}</button></div>
 <div><div class="box"><h3>Open games <span class="muted">— join within ±10%</span></h3><div id="cfl"></div></div><div class="box"><h3>Recent flips</h3><div id="cfr"></div></div></div></div>`;cfList()}
function cfList(){const cf=S.cf||{open:[],recent:[]},l=$('#cfl');if(!l)return;
 l.innerHTML=cf.open.slice().reverse().map(cfGameRow).join('')||'<p class="muted">No open games — post one!</p>';
 $('#cfr').innerHTML=cf.recent.slice().reverse().map(cfRecentRow).join('')||'<p class="muted">Nothing yet.</p>'}async function cfCreate(){const r=await api('cfcreate',{items:sel,side:cfSide});if(r.ok){sel={};toast('Game created')}await load();if(tab==='coinflip')render()}
async function cfCancel(id){await api('cfcancel',{id});await load();if(tab==='coinflip')render()}
async function cfJoin(id){const r=await api('cfjoin',{id,items:sel});if(r.ok)sel={};await load();if(tab==='coinflip')render()}
// Called on every state load: refresh the list and play the flip once for games I'm in
function cfWatch(){const cf=S.cf;if(!cf)return;const rec=cf.recent,mx=rec.length?rec[rec.length-1].id:0;
 if(cfSeen===null){cfSeen=mx;return}
 if(tab==='coinflip')cfList();
 for(const g of rec){if(g.id>cfSeen&&(g.c.id===S.me.id||g.j.id===S.me.id)){cfSeen=Math.max(cfSeen,g.id);cfPlay(g)}}
 cfSeen=Math.max(cfSeen,mx)}
function cfPlay(g){const old=$('#cfov');if(old)old.remove();const d=document.createElement('div');d.id='cfov';
 const fl=g.flips||[g.result,g.result,g.result],nh=fl.filter(x=>x==='heads').length,me=S.me.id,mySide=g.c.id===me?g.cSide:g.jSide,won=g.winner.id===me;
 const coins=fl.map((s,i)=>{const rf=1440+i*360+(s==="tails"?180:0),dur=2+i*.35,up=-(70+i*22);
  return `<div class="coin" style="--rf:${rf}deg;--up:${up}px;transform:rotateY(${rf}deg);animation:${cfg.anim?`cflip ${dur}s cubic-bezier(.3,.6,.3,1) forwards`:'none'}"><div class="h">H</div><div class="t">T</div></div>`}).join('');
 d.innerHTML=`<img class="cflogo" src="/logo.png" alt=""><h2>${g.c.name} <span class="side ${g.cSide}">${g.cSide}</span> vs ${g.j.name} <span class="side ${g.jSide}">${g.jSide}</span></h2><div class="coins">${coins}</div><div class="tally" id="cft"></div><div class="cfres ${won?'win':'lose'}" id="cfres"><div class="big">${won?'YOU WON!':'YOU LOST'}</div><small>${won?`+${fmt(g.won)} value`:`${g.winner.name} took the pot`}</small></div>`;
 d.onclick=()=>d.remove();document.body.appendChild(d);
 const t=cfg.anim?2900:0;
 setTimeout(()=>{const x=$('#cft');if(x)x.innerHTML=`<b style="color:#6cb4ff">${nh} H</b> &nbsp;·&nbsp; <b style="color:#ff7b7b">${3-nh} T</b> &nbsp;→&nbsp; <b>${g.result==='heads'?'HEADS':'TAILS'} wins</b>`},t);
 setTimeout(()=>{const r=$('#cfres');if(r)r.classList.add('show')},t+500);
 setTimeout(()=>d.remove(),cfg.anim?9000:4000)}

load();
</script></body></html>
