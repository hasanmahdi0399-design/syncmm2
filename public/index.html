/* ===== UI polish v2: glass, depth, glow, motion ===== */
:root{--ease:cubic-bezier(.2,.8,.2,1);--glass:linear-gradient(160deg,#ffffff0f,#ffffff04 40%,#0000);--edge:linear-gradient(140deg,#ffffff38,#ffffff0a 35%,#8f7cff44 100%)}
body{background:radial-gradient(900px 520px at 85% -8%,#5b49e028,transparent 65%),radial-gradient(700px 480px at -5% 105%,#2f8cff1c,transparent 65%),var(--bg);background-attachment:fixed}
::selection{background:#8f7cff66}
*{scrollbar-width:thin;scrollbar-color:#3a3f55 transparent}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:#3a3f55;border-radius:8px}::-webkit-scrollbar-thumb:hover{background:#5b49e0}
/* panels: frosted glass with gradient edge + top light */
.box,.mstage,.uc,.mchip{position:relative;background:var(--glass),linear-gradient(180deg,#1a1e2acc,#11141ccc)!important;border:1px solid transparent!important;background-clip:padding-box;backdrop-filter:blur(10px) saturate(1.2);box-shadow:0 20px 50px -24px #000,0 0 0 1px #ffffff12,inset 0 1px 0 #ffffff1c}
.box::before,.mstage::before{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1px;background:var(--edge);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;opacity:.7}
.box{transition:transform .25s var(--ease),box-shadow .25s}
.box:hover{box-shadow:0 26px 60px -24px #000,0 0 40px -18px var(--glow2),0 0 0 1px #ffffff1a,inset 0 1px 0 #ffffff26}
h3{background:linear-gradient(90deg,#fff,#c9c2ff);-webkit-background-clip:text;background-clip:text;color:transparent}
/* buttons: gradient + shine sweep */
button:not(.s):not(.hist-tab):not(.mt):not(.cf-close){position:relative;overflow:hidden;background:linear-gradient(135deg,#9a87ff,#5b49e0 60%,#4636c4);box-shadow:0 8px 22px -8px var(--glow2),inset 0 1px 0 #ffffff55,inset 0 -2px 0 #0003}
button:not(.s):not(.hist-tab):not(.mt):not(.cf-close)::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,#ffffff55,transparent);transform:skewX(-20deg);transition:left .6s var(--ease)}
button:not(.s):hover:not(:disabled)::after{left:130%}
button:hover:not(:disabled){transform:translateY(-2px)}
button.s{background:linear-gradient(180deg,#1f2433,#161a26);box-shadow:inset 0 1px 0 #ffffff14}
input,select{background:#0c0f17;box-shadow:inset 0 2px 6px #0007;transition:border-color .2s,box-shadow .2s,background .2s}
input:focus,select:focus{background:#10131d;box-shadow:inset 0 2px 6px #0007,0 0 0 3px var(--glow3),0 0 22px -6px var(--glow2)}
/* sidebar */
#sb{background:linear-gradient(180deg,#0f1220f2,#070910f2);backdrop-filter:blur(14px);box-shadow:20px 0 60px -30px #000}
.logo{background:linear-gradient(120deg,#fff,var(--ac1),#7ad7ff,var(--ac1));background-size:250% 100%;-webkit-background-clip:text;background-clip:text;animation:uiShimmer 6s linear infinite}
#nv button{transition:background .2s,color .2s,transform .2s var(--ease),padding .2s var(--ease)}
#nv button:hover{transform:translateX(4px);background:linear-gradient(90deg,#8f7cff22,transparent)}
#nv button.on{background:linear-gradient(90deg,#8f7cff38,transparent);box-shadow:inset 0 0 0 1px #8f7cff22}
#nv button.on::before{box-shadow:0 0 14px var(--ac1)}
.top{background:#0b0d16cc;box-shadow:0 10px 30px -20px #000}
/* cards */
.card{background:var(--glass),linear-gradient(180deg,#1b2030,#11141d);box-shadow:inset 0 1px 0 #ffffff14,0 10px 24px -14px #000}
.card:hover{transform:translateY(-6px) scale(1.02);border-color:#8f7cff88;box-shadow:0 20px 36px -14px #000,0 0 30px -10px var(--glow2)}
.card:nth-child(n){animation-delay:calc(var(--i,0)*0s)}
.grid>.card:nth-child(1){animation-delay:.02s}.grid>.card:nth-child(2){animation-delay:.05s}.grid>.card:nth-child(3){animation-delay:.08s}.grid>.card:nth-child(4){animation-delay:.11s}.grid>.card:nth-child(5){animation-delay:.14s}.grid>.card:nth-child(6){animation-delay:.17s}.grid>.card:nth-child(7){animation-delay:.2s}.grid>.card:nth-child(8){animation-delay:.23s}
.ic{filter:drop-shadow(0 8px 12px #000a)}.card:hover .ic{animation:uiBob 1.2s ease-in-out infinite}
/* rows, stats, tables */
.stat{transition:background .2s,padding .2s}.stat:hover{background:#ffffff08;padding-left:8px;padding-right:8px;border-radius:8px}
table tr{transition:background .15s}table tr:hover td{background:#ffffff08}
/* mines/towers tiles */
.mt{transition:transform .15s var(--ease),box-shadow .2s,border-color .2s,background .2s}
.mt.gem{animation:flip .45s var(--ease),uiGemGlow 2.4s ease-in-out .5s infinite}
/* page transition */
#view{animation:uiPage .45s var(--ease) both}
.mchip.hl b,.g{text-shadow:0 0 14px #5ee6a055}
.big{box-shadow:0 14px 34px -12px var(--glow2),inset 0 1px 0 #ffffff55}
@keyframes uiShimmer{to{background-position:250% 0}}
@keyframes uiBob{50%{transform:translateY(-4px) rotate(-3deg)}}

@keyframes uiPage{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.logo,.card:hover .ic,.mt.gem,#view{animation:none!important}}

function rkBox(r,self){if(!r)return '';const nx=r.next,pc=nx?Math.floor(nx.pct*1000)/10:100,k=r.k||'';
 const head=r.k?`<span class="rkn">${rkTag(k)}</span><span class="rkb">${pctTxt(r.rb)} rakeback · ${pctTxt(r.rf)} referrals</span>`:`<span class="rkn muted">No rank yet</span>`;
 const need=nx?`<p class="rkc">${self?'You need':'Needs'} <b>${rkA(nx.needG)} gems</b> wagered on PS99 <b>or</b> <b>${rkT(nx.needT)} tokens</b> wagered on MM2 to reach ${rkTag(nx.k)} <span style="color:var(--m)">(${rkA(nx.g)} gems / ${rkT(nx.t)} tokens total)</span></p>`:`<p class="rkc">👑 Max rank reached.</p>`;
 return `<div class="box rkbox k-${k||'none'}"><h3 style="margin:0 0 8px">Rank</h3><div class="rktop">${head}${nx?`<span class="muted" style="font-size:12px">Next: ${rkTag(nx.k)} · ${pc}%</span>`:''}</div>
  ${nx?`<div class="rkbar"><i style="width:${Math.max(2,pc)}%"></i></div>`:''}${need}
  <p class="rkc" style="margin-top:6px">Total wagered — PS99: <b>${rkA(r.p)} gems</b> · MM2: <b>${rkT(r.m)} tokens</b>. Ranks sync across both sites.</p>
  ${self?`<table class="rkt"><tr><th>Rank</th><th>PS99 wagered</th><th>or MM2 wagered</th><th>Rakeback</th><th>Referrals</th></tr>${(r.tiers||[]).map(t=>`<tr class="${t.k===k?'me':''}"><td>${rkTag(t.k)}</td><td>${rkA(t.g)} gems</td><td>${rkT(t.t)} tokens</td><td>${pctTxt(t.rb)}</td><td>${pctTxt(t.rf)}</td></tr>`).join('')}</table><p class="rkc" style="margin-top:6px">Rakeback is what you earn back on your own bets. Referrals is what you earn from your referrals' bets (max 1.5%).</p>`:''}</div>`}

let bjBet=MODE==='ps99'?1000000:10,bjBusy=false,bjSeen={id:0,p:0,d:0,hole:false};
const bjFace=c=>{const r=c.slice(0,-1),s=c.slice(-1),red='♥♦'.includes(s);return `<div class="face ${red?'red':''}"><i class="cr">${r}<em>${s}</em></i><b class="cs">${s}</b><i class="cr bt">${r}<em>${s}</em></i><img class="wm" src="${LG()}" alt=""></div>`};
const bjBackH='<div class="back"><div class="bdr"><img src="'+LG()+'" alt=""></div></div>';
const bjCard=(c,cls='',d=0)=>`<div class="pcard ${cls}" style="--d:${d.toFixed(2)}s"><div class="inner">${c?bjFace(c):'<div class="face"></div>'}${bjBackH}</div></div>`;
function rBj(v){const g=S.bj,live=g&&!g.done,fresh=!g||g.id!==bjSeen.id;
 if(fresh)bjSeen={id:g?g.id:0,p:0,d:0,hole:false};
 let t=0;const step=.38;let pc='',dc='';
 if(g){const P=g.player,D=g.dealer;
  if(fresh){P.forEach((c,i)=>{pc+=bjCard(c,'deal',i*.5)});D.forEach((c,i)=>{dc+=bjCard(c,'deal'+(c?'':' down'),.25+i*.5)});t=1.1}
  else{P.forEach((c,i)=>{if(i<bjSeen.p)pc+=bjCard(c);else{pc+=bjCard(c,'deal',t);t+=step+.2}});
   D.forEach((c,i)=>{if(!c)dc+=bjCard(null,'down');else if(i===1&&!bjSeen.hole&&bjSeen.d>=2&&bjSeen.holeDown){dc+=bjCard(c,'rev',t);t+=.7}else if(i<bjSeen.d)dc+=bjCard(c);else{dc+=bjCard(c,'deal',t);t+=step+.2}})}
  bjSeen={id:g.id,p:g.player.length,d:g.dealer.length,hole:!!g.dealer[1],holeDown:!g.dealer[1]}}
 const res=g&&g.done?g.result:null,lab={bj:'BLACKJACK!',win:'YOU WIN',lose:'DEALER WINS',bust:'BUST',push:'PUSH'}[res],cls={bj:'bj',win:'win',lose:'lose',bust:'lose',push:'push'}[res];
 const pv=g?g.pv:0,dv=g?g.dv:0,net=g?g.payout-g.bet:0;
 const sub=res?(res==='push'?'Bet returned':net>0?`+${fmt(net)} ${CI()}`+(res==='win'&&dv>21?' · dealer busts':''):`−${fmt(g.bet)} ${CI()}`):'';
 const ctl=live?`<div class="bjact"><button class="hit" onclick="bjAct('bjhit')" ${bjBusy?'disabled':''}>Hit</button><button class="stand" onclick="bjAct('bjstand')" ${bjBusy?'disabled':''}>Stand</button><button class="dbl" onclick="bjAct('bjdouble')" ${bjBusy||!g.canDouble||S.me.tokens<g.bet?'disabled':''}>Double</button></div>`
 :`<div class="bjbet"><label class="lb" style="margin:0 0 6px">Bet <span class="muted" style="text-transform:none">(min ${fmt(MINB())})</span></label><div class="row">${AF('bjb',bjBet,'bjBet=amtP(this.value)',PHA(),80)}<button class="s" onclick="bjSet(.5)">½</button><button class="s" onclick="bjSet(2)">2×</button><button class="s" onclick="bjSet(0)">Max</button></div><div class="row">${BETS().map(x=>`<button class="s" onclick="bjBet=${x};rBj($('#view'))">${fmt(x)}</button>`).join('')}</div><button class="big" onclick="bjDeal()" ${bjBusy?'disabled':''}>${g?'Deal again':'Deal'}</button></div>`;
 v.innerHTML=`<div class="bjw"><div class="felt"><div class="deckp"><div class="pcard down"><div class="inner">${bjBackH}${'<div class="face"></div>'}</div></div><div class="pcard down"><div class="inner">${bjBackH}<div class="face"></div></div></div><div class="pcard down"><div class="inner">${bjBackH}<div class="face"></div></div></div></div>
 <div class="dealer"><div class="lbl">DEALER ${g?`<span class="tot ${dv>21?'bust':''}">${live?dv+' + ?':dv}</span>`:''}</div><div class="hand ${res&&(res==='lose'||res==='bust')?'win':''}">${dc||'<span class="muted" style="align-self:center">Place your bet</span>'}</div></div>
 ${res?`<div class="bjres ${cls}" style="--d:${(t+.3).toFixed(2)}s"><div class="big2">${lab}</div><small>${sub}</small></div>`:'<div style="min-height:20px"></div>'}
 <div class="player"><div class="hand ${res==='win'||res==='bj'?'win':res==='lose'||res==='bust'?'lose':''}">${pc}</div><div class="lbl">YOU ${g?`<span class="tot ${pv>21?'bust':pv===21?'b21':''}">${pv}</span>`:''}</div></div>${ctl}</div>
 <div class="box bjinfo"><h3>🃏 Blackjack</h3><div class="stat"><span>Balance</span><b class="tok">${fmt(S.me.tokens)} ${CI()}</b></div>${g?`<div class="stat"><span>Current bet</span><b>${fmt(g.bet)} ${CI()}${g.doubled?' (doubled)':''}</b></div>`:''}
 <p class="muted" style="font-size:12px;line-height:1.6;margin-top:12px"><b style="color:var(--t)">Rules</b><br>• Beat the dealer without going over 21<br>• Blackjack pays 3:2<br>• Dealer stands on 17<br>• Double = one card, double bet<br>• Fresh shuffled deck every hand</p></div></div>`;
 if(!live&&$('#bjb'))void 0}
function bjSet(x){bjBet=x?Math.max(MINB(),Math.floor(bjBet*x)):Math.max(MINB(),Math.floor(S.me.tokens));rBj($('#view'))}
async function bjDeal(){if(bjBusy)return;if(!(bjBet>=MINB())){toast('Minimum bet is '+fmt(MINB()));return}bjBusy=true;const r=await api('bjstart',{bet:bjBet});bjBusy=false;await load();if(tab==='blackjack')rBj($('#view'))}
async function bjAct(a){if(bjBusy)return;bjBusy=true;rBj($('#view'));await api(a);bjBusy=false;await load();if(tab==='blackjack')rBj($('#view'))}

try{const sp=new URLSearchParams(location.search);if(sp.has('discord')){const ok=sp.get('discord')==='ok';setTimeout(()=>toast(ok?'Discord linked!':(sp.get('m')||'Could not link Discord'),ok),900);history.replaceState(null,'',location.pathname)}}catch(e){}
try{const sp=new URLSearchParams(location.search);if(sp.has('ref')){localStorage.refc=String(sp.get('ref')).slice(0,40);history.replaceState(null,'',location.pathname)}}catch(e){}
let refTry=0;setInterval(async()=>{try{const c=localStorage.refc;if(!c||!S||!S.me||refTry>=3)return;if(S.me.rw&&S.me.rw.by){localStorage.removeItem('refc');return}refTry++;const r=await api('refset',{code:c});localStorage.removeItem('refc');if(r&&r.ok){toast(r.msg,1);await load();if(tab==='rewards')rRew($('#view'))}}catch(e){}},2500);
load();
</script></body></html>
