.hst{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:16px}.hst div{background:var(--p);border:1px solid var(--ln);border-radius:14px;padding:12px;text-align:center}.hst small{display:block;color:var(--m);font-size:10px;text-transform:uppercase;letter-spacing:.8px}.hst b{font-size:17px}
.hgames{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.hg{position:relative;overflow:hidden;text-align:left;padding:16px 14px;border-radius:18px;border:1px solid var(--ln);background:linear-gradient(160deg,var(--p3),var(--p));color:var(--t);transition:transform .2s,box-shadow .2s,border-color .2s;animation:hgin .5s both;animation-delay:calc(var(--i)*70ms)}
.hg::before{content:"";position:absolute;right:-18px;bottom:-18px;width:90px;height:90px;background:var(--logo) center/contain no-repeat;opacity:.07;transition:.4s}

.mc.h,.mc.t{background:none;border:0;font-size:0}.mc svg{width:100%;height:100%;display:block}
.pips i.h,.pips i.t{background:none;border:0;font-size:0}.pips i svg{width:100%;height:100%;display:block}
.c3 .t{transform:rotateY(180deg)}#cfov .cfc{perspective:1000px}.c3{margin-top:0}#c3w{margin-top:130px;transform-style:preserve-3d}
.csh{background:#000c}

button.tiny{padding:3px 9px;font-size:11px;border-radius:8px;margin-left:4px}
.rdmbox{background:linear-gradient(135deg,#8f7cff22,#0d1018cc)!important;border-color:#8f7cff55!important}

.wchips{display:flex;gap:6px;flex-wrap:wrap}.wchips .s{padding:7px 12px;border-radius:99px;font-size:12px}.wchips .s.on{background:linear-gradient(135deg,var(--ac1),var(--ac1b));border-color:transparent;color:#fff}
.card.wc{transition:transform .2s,box-shadow .2s,border-color .2s}.card.wc:hover{transform:translateY(-4px);border-color:var(--ac1);box-shadow:0 14px 30px -14px var(--glow2)}
.wqx{margin-top:4px}.wqb{display:inline-block;font-size:10px;font-weight:700;color:var(--ac2);background:#8f7cff26;border-radius:99px;padding:2px 8px}
.wq{display:flex;align-items:center;gap:4px;margin:8px 0 6px}.wq .s{padding:4px 0;width:28px;border-radius:8px;font-size:14px}.wq .s:last-child{width:auto;padding:4px 8px;font-size:11px;margin-left:auto}.wq b{min-width:26px;text-align:center}
.wdb{width:100%;padding:8px;border-radius:10px;font-size:13px}
.wrq{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--ln)}.wrq:first-of-type{border-top:0}
.wpill{font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;background:#ffffff14;white-space:nowrap}.wpill.pending{background:#fbbf2426;color:#fbbf24}.wpill.approved{background:#5ee6a026;color:var(--g)}.wpill.rejected{background:#ff6b7a26;color:var(--r)}
@media(max-width:480px){.wdst{grid-template-columns:1fr}.wdst div{display:flex;gap:10px;align-items:center}.wdst i{margin:0}.wdst span{display:none}}
/* withdraw modal + bar */
.wbar{position:sticky;bottom:14px;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:#12142bee;backdrop-filter:blur(10px);border:1px solid var(--ac1);box-shadow:0 14px 40px -12px var(--glow2);margin-top:4px}
.wbar.dpbar-fixed{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:1001;margin:0 auto;max-width:720px;width:auto;box-sizing:border-box}

.wlist{text-align:left;max-height:260px;overflow:auto;border:1px solid var(--ln);border-radius:14px;background:#00000040}.wli{display:flex;align-items:center;gap:10px;padding:9px 12px;border-top:1px solid var(--ln)}.wli:first-child{border-top:0}.wli b{flex:1;font-size:14px}.wic{width:34px;height:34px;display:grid;place-items:center;flex:none}.wic{font-size:22px;line-height:1;overflow:hidden}.wic *{max-width:100%;max-height:100%;font-size:inherit}.wx{color:var(--ac2);font-weight:800}

/* deposit extras (light) */
@keyframes dpup{from{opacity:0;transform:translateY(14px)}}@keyframes dppulse{50%{box-shadow:0 0 0 5px #fbbf2400,0 0 0 0 #fbbf2400}0%{box-shadow:0 0 0 0 #fbbf2466}}@keyframes dpsh{to{background-position:200% 0}}@keyframes dpchk{0%{transform:scale(.85)}60%{transform:scale(1.06)}}
.wbar.in{animation:dpup .35s cubic-bezier(.2,1.2,.3,1) both}

.wdb{transition:transform .12s,background .2s}.wdb:active,.wq .s:active,{transform:scale(.95)}
.wdb.s.on{animation:dpchk .3s both}
.wpill.pending{animation:dppulse 1.8s ease-out infinite}
.wrq{animation:dpup .35s both}.wrq:nth-of-type(2){animation-delay:.05s}.wrq:nth-of-type(3){animation-delay:.1s}
.wdots i{transition:background .3s,width .3s}.wdots i.on{width:38px}
.wli{animation:dpup .3s both}.wli:nth-child(2){animation-delay:.05s}.wli:nth-child(3){animation-delay:.1s}.wli:nth-child(4){animation-delay:.15s}
.wbot{animation:dppulse 2s ease-out infinite}

.twbig{text-align:center}.twbig small{display:block;color:var(--m);font-size:11px;text-transform:uppercase;letter-spacing:1px}.twbig b{font-size:38px;font-weight:900;background:linear-gradient(135deg,#fff,var(--g));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 14px #5ee6a066)}

.hr-t p{margin:8px 0 0;color:var(--m)}.hr-t p b{color:var(--t)}
.hr-tag{display:inline-flex;align-items:center;gap:7px;font-size:11px;font-weight:700;letter-spacing:.14em;color:#7dffc4;background:#5ee6a01a;border:1px solid #5ee6a044;border-radius:99px;padding:4px 11px}.hr-tag i{width:7px;height:7px;border-radius:50%;background:#5ee6a0;box-shadow:0 0 10px #5ee6a0;animation:lv 1.6s ease-in-out infinite}
.hb2{margin-left:auto;text-align:right}.hb2 small{display:block;color:var(--m);font-size:11px;letter-spacing:.14em;text-transform:uppercase}.hb2>b{display:block;font-size:30px;line-height:1.2;text-shadow:0 0 24px #fbbf2455}
.hb2b{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}.hb2b button{padding:8px 14px;border-radius:99px;font-size:13px}

.hg::after{content:"";position:absolute;inset:auto -30% -70% -30%;height:90%;background:radial-gradient(closest-side,var(--glow2),transparent);opacity:0;transition:opacity .3s}.hg:hover::after{opacity:.55}

  bjSeen={id:g.id,p:g.player.length,d:g.dealer.length,hole:!!g.dealer[1],holeDown:!g.dealer[1]}}
 const res=g&&g.done?g.result:null,lab={bj:'BLACKJACK!',win:'YOU WIN',lose:'DEALER WINS',bust:'BUST',push:'PUSH'}[res],cls={bj:'bj',win:'win',lose:'lose',bust:'lose',push:'push'}[res];
 const pv=g?g.pv:0,dv=g?g.dv:0,net=g?g.payout-g.bet:0;
 const sub=res?(res==='push'?'Bet returned':net>0?`+${fmt(net)} ${CI()}`+(res==='win'&&dv>21?' · dealer busts':''):`−${fmt(g.bet)} ${CI()}`):'';
 const ctl=live?`<div class="bjact"><button class="hit" onclick="bjAct('bjhit')" ${bjBusy?'disabled':''}>Hit</button><button class="stand" onclick="bjAct('bjstand')" ${bjBusy?'disabled':''}>Stand</button><button class="dbl" onclick="bjAct('bjdouble')" ${bjBusy||!g.canDouble||S.me.tokens<g.bet?'disabled':''}>Double</button></div>`
 :`<div class="bjbet"><label class="lb" style="margin:0 0 6px">Bet <span class="muted" style="text-transform:none">(min ${fmt(MINB())})</span></label><div class="row">${AF('bjb',bjBet,'bjBet=amtP(this.value)',PHA(),80)}<button class="s" onclick="bjSet(.5)">½</button><button class="s" onclick="bjSet(2)">2×</button><button class="s" onclick="bjSet(0)">Max</button></div><div class="row">${BETS().map(x=>`<button class="s" onclick="bjBet=${x};rBj($('#view'))">${fmt(x)}</button>`).join('')}</div><button class="big" onclick="bjDeal()" ${bjBusy?'disabled':''}>${g?'Deal again':'Deal'}</button></div>`;
 v.innerHTML=`<div class="bjw"><div class="felt"><div class="deckp"><div class="pcard down"><div class="inner">${bjBackH}${'<div class="face"></div>'}</div></div><div class="pcard down"><div class="inner">${bjBackH}<div class="face"></div></div></div><div class="pcard down"><div class="inner">${bjBackH}<div class="face"></div></div></div></div>
 <div class="dealer"><div class="lbl">DEALER ${g?`<span class="tot ${dv>21?'bust':''}">${live?dv+' + ?':dv}</span>`:''}</div><div class="hand ${res&&(res==='lose'||res==='bust')?'win':''}">${dc||'<span class="muted" style="align-self:center">Place your bet</span>'}</div></div>
 ${res?`<div class="bjres ${cls}" style="--d:${(t+.3).toFixed(2)}s"><div class="big2">${lab}</div><small>${sub}</small></div>`:'<div style="min-height:20px"></div>'}
 <div class="player"><div class="hand ${res==='win'||res==='bj'?'win':res==='lose'||res==='bust'?'lose':''}">${pc}</div><div class="lbl">YOU ${g?`<span class="tot ${pv>21?'bust':pv===21?'b21':''}">${pv}</span>`:''}</div></div>${ctl}</div>
 <div class="box bjinfo"><h3>🃏 Blackjack</h3><div class="stat"><span>Balance</span><b class="tok">${fmt(S.me.tokens)} ${CI()}</b></div>${g?`<div class="stat"><span>Current bet</span><b>${fmt(g.bet)} ${CI()}${g.doubled?' (doubled)':''}</b></div>`:''}
 <p class="muted" style="font-size:12px;line-height:1.6;margin-top:12px"><b style="color:var(--t)">Rules</b><br>• Beat the dealer without going over 21<br>• Blackjack pays 3:2<br>• Dealer stands on 17<br>• Double = one card, double bet<br>• Fresh shuffled deck every hand</p></div></div>`;
 if(!live&&$('#bjb'))void 0}
function bjSet(x){bjBet=x?Math.max(MINB(),Math.floor(bjBet*x)):Math.max(MINB(),Math.floor(S.me.tokens));rBj($('#view'))}
async function bjDeal(){if(bjBusy)return;if(!(bjBet>=MINB())){toast('Minimum bet is '+fmt(MINB()));return}bjBusy=true;const r=await api('bjstart',{bet:bjBet});bjBusy=false;await load();if(tab==='blackjack')rBj($('#view'))}
async function bjAct(a){if(bjBusy)return;bjBusy=true;rBj($('#view'));await api(a);bjBusy=false;await load();if(tab==='blackjack')rBj($('#view'))}
