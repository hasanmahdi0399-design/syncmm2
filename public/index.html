<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sync MM2</title>
<style>
:root{--bg:#0d0e10;--p:#16181b;--p2:#202327;--a:#c4c9d0;--t:#e7e9ec;--m:#8b9098;--g:#4ade80;--r:#f87171;--ln:#2a2d32}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:14px system-ui,sans-serif}
button,input,select{font:inherit;color:var(--t);background:var(--p2);border:1px solid var(--ln);border-radius:10px;padding:9px 12px}
button{cursor:pointer;background:var(--a);color:#0d0e10;border:0;font-weight:700;transition:transform .1s,opacity .2s}button:active{transform:scale(.96)}button:disabled{opacity:.4}
button.s{background:var(--p2);color:var(--t);border:1px solid var(--ln)}input[type=range]{accent-color:var(--a);padding:0}
#sb{position:fixed;left:0;top:0;bottom:0;width:230px;background:var(--p);border-right:1px solid var(--ln);padding:14px 10px;z-index:20;transform:translateX(-100%);transition:transform .25s;overflow-y:auto}
#sb.open{transform:none}#ov{display:none;position:fixed;inset:0;background:#0009;z-index:15}#ov.show{display:block}
.logo{font-weight:800;font-size:20px;color:var(--a);padding:4px 8px 12px;letter-spacing:.5px}
.uc{display:flex;gap:10px;align-items:center;background:var(--p2);border-radius:12px;padding:10px;margin-bottom:12px}.uc b{display:block;word-break:break-all}
#nv button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:none;color:var(--m);padding:11px 12px;border-radius:10px;margin-bottom:2px;border-left:3px solid transparent;font-weight:600}
#nv button:hover{background:var(--p2);color:var(--t)}#nv button.on{background:var(--p2);color:var(--t);border-left-color:var(--a)}
.top{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--p);position:sticky;top:0;z-index:5;border-bottom:1px solid var(--ln)}.top b{flex:1;font-size:16px}
main{padding:14px;max-width:960px;margin:auto}
@media(min-width:860px){#sb{transform:none}#mn{margin-left:230px}.top .mb{display:none}#ov{display:none!important}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.card{background:var(--p);border:1px solid var(--ln);border-radius:12px;padding:10px;text-align:center;cursor:pointer;transition:transform .15s,border-color .15s;animation:up .3s both}
.card:hover{transform:translateY(-3px);border-color:var(--a)}.card.sel{border-color:var(--g);box-shadow:0 0 0 1px var(--g)}
.ic{height:64px;display:flex;align-items:center;justify-content:center;font-size:42px}.ic img{max-height:64px;max-width:100%}
.card b{display:block;font-size:12px;margin:4px 0}.card small{color:var(--g)}.muted{color:var(--m)}.tok{color:#fbbf24;font-weight:700}
.box{background:var(--p);border:1px solid var(--ln);border-radius:14px;padding:16px;margin-bottom:14px;animation:up .3s both}h3{margin:0 0 12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}.lb{display:block;color:var(--m);margin:14px 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.6px}
.stat{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--ln)}.g{color:var(--g)}
.big{width:100%;padding:14px;font-size:16px;margin-top:14px;border-radius:12px}
.mw{display:grid;grid-template-columns:1fr;gap:14px}@media(min-width:760px){.mw{grid-template-columns:300px 1fr}}
.mg{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;max-width:380px;margin:auto}.mg button{aspect-ratio:1;font-size:24px;padding:0;background:var(--p2);color:var(--t);border:1px solid var(--ln)}
.mg button:not(:disabled):hover{border-color:var(--a)}.mg .ok{background:#12301f;border-color:var(--g);animation:flip .4s}.mg .bm{background:#3a1519;border-color:var(--r);animation:flip .4s}.mg .hit{animation:shake .5s}
.mg.pls button{animation:pulse .5s infinite alternate}
.ld{display:flex;flex-direction:column;align-items:center;gap:14px;padding:90px 0}.sp{width:40px;height:40px;border:4px solid var(--p2);border-top-color:var(--a);border-radius:50%;animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}@keyframes up{from{opacity:0;transform:translateY(10px)}}@keyframes flip{from{transform:rotateY(90deg) scale(.7)}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}@keyframes pulse{to{background:#2c3036;transform:scale(.92)}}
#wheel{width:240px;height:240px;border-radius:50%;margin:10px auto;border:4px solid var(--p2)}
.ptr{width:0;height:0;border:12px solid transparent;border-top:22px solid #fff;margin:0 auto -14px;position:relative;z-index:2}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--r);color:#000;font-weight:600;padding:10px 16px;border-radius:10px;display:none;z-index:99}
table{width:100%;border-collapse:collapse}td,th{padding:7px;text-align:left;border-bottom:1px solid var(--ln)}.av{width:28px;height:28px;border-radius:50%;vertical-align:middle;margin-right:6px}
.noanim *{animation:none!important;transition:none!important}
#chatbtn{position:fixed;right:18px;bottom:18px;width:52px;height:52px;border-radius:50%;font-size:22px;z-index:50;box-shadow:0 4px 14px #0008;display:flex;align-items:center;justify-content:center;padding:0}
#chatbtn.alert{background:var(--r)}
#chatpanel{position:fixed;right:18px;bottom:82px;width:300px;max-height:420px;z-index:50;padding:0;overflow:hidden;background:var(--p);border:1px solid var(--ln);border-radius:14px;display:none;flex-direction:column}
#chatpanel.open{display:flex}
#chatmsgs{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:6px;max-height:300px}
.cmsg{font-size:12px;line-height:1.4;word-break:break-word}.cmsg b{color:var(--a)}
#chatin{display:flex;gap:6px;padding:8px;border-top:1px solid var(--ln)}#chatin input{flex:1;min-width:0}
@media(max-width:480px){#chatpanel{width:calc(100vw - 24px);right:12px}}
</style></head><body><div id="app"><p style="padding:20px;color:#8b9098">Loading… (if this never goes away, the script did not run)</p></div><div id="toast"></div>
<script>window.onerror=function(m,u,l){document.body.insertAdjacentHTML('afterbegin','<pre style="color:#f87171;padding:12px;white-space:pre-wrap;font-size:12px">JS error: '+m+' (line '+l+')</pre>')};window.onunhandledrejection=function(e){document.body.insertAdjacentHTML('afterbegin','<pre style="color:#f87171;padding:12px;white-space:pre-wrap;font-size:12px">Error: '+(e.reason&&e.reason.message||e.reason)+'</pre>')}</script>
<script>
const $=s=>document.querySelector(s),fmt=n=>Math.floor(n).toLocaleString();
let S=null,tab='home',q='',sel={},mres=null,mlast=-1,seen=0,pend=null,nav=0,mbet=10,mmn=3,mbusy=false,cfg=JSON.parse(localStorage.cfg||'{"anim":true,"hide":false}');
let chatOpen=false,chatSeen=0;
const NAV=[['home','🏠','Home'],['values','📈','Values'],['inventory','🎒','Inventory'],['exchange','🔄','Exchange'],['jackpot','🎰','Jackpot'],['mines','💣','Mines'],['withdraw','📤','Withdraw'],['deposit','💳','Deposit'],['leaderboard','🏆','Leaderboard'],['settings','⚙️','Settings'],['admin','🛠️','Admin']];
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._);t._=setTimeout(()=>t.style.display='none',2500)};
const api=async(a,b={})=>{try{const r=await fetch('/api/'+a,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b)});const j=await r.json();if(j.error)toast(j.error);return j}catch{toast('Network error');return{}}};
const ic=i=>/^(https?:)?\//.test(i.icon)?`<img src="${i.icon}" loading="lazy" alt="">`:`<span>${i.icon}</span>`;
const card=(i,x='',c='',o='')=>`<div class="card ${c}" ${o}><div class="ic">${ic(i)}</div><b>${i.name}</b><small>${fmt(i.value)}</small>${x}</div>`;
const byId=id=>S.items.find(i=>i.id===id),mlt=(m,n)=>{let x=.97;for(let k=0;k<n;k++)x*=(25-k)/(25-m-k);return x};
const hue=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))%360;return `hsl(${h} 65% 60%)`};
async function load(){S=await api('state');document.body.className=cfg.anim?'':'noanim';if(S.error||(!S.guest&&!S.me)){if(!S.me&&!$('#view'))$('#app').innerHTML='<pre style="color:#f87171;padding:14px;white-space:pre-wrap">Server error: '+(S.error||'no response')+'</pre>';return}if(S.guest){if(!$('#lg'))login();return}if(!$('#view'))shell();head();if(tab==='jackpot')jpUpdate();if(tab==='home'&&$('#view')&&$('#view').firstElementChild)rHome($('#view'));chatTick()}
let tick=0;setInterval(()=>{if(document.hidden||pend||(S&&S.guest))return;if(tab!=='jackpot'&&++tick%6)return;load()},1500);
function login(){if($('#un'))return;$('#app').innerHTML=`<main><div class="box" style="max-width:420px;margin:60px auto"><div class="logo" style="font-size:30px">Sync MM2</div><p class="muted">Verify your Roblox account to play.</p><div id="lg"><input id="un" placeholder="Roblox username" style="width:100%;margin-bottom:10px"><button class="big" style="margin:0" onclick="vstart()">Get verification code</button></div><p class="muted" style="font-size:11px;margin-top:14px">We log basic device/network info to prevent multi-accounting and abuse.</p></div></main>`}
async function vstart(){const r=await api('start',{username:$('#un').value});if(!r.code)return;pend=r;
 $('#lg').innerHTML=`<p>Paste this into your <b>Roblox bio (About)</b> within 10 minutes:</p><div class="box" style="background:var(--p2);user-select:all;font-weight:700">${r.code}</div><p class="muted" id="cd"></p><button class="s" onclick="navigator.clipboard.writeText('${r.code}');toast('Copied')">Copy code</button>`;
 const t=setInterval(async()=>{if(!pend)return clearInterval(t);const s=Math.max(0,Math.round((r.exp-Date.now())/1000));$('#cd').textContent=`Waiting for bio… expires in ${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
  if(s%3===0){const c=await api('check',{tok:r.tok});if(c.ok){pend=null;clearInterval(t);load()}else if(c.error){pend=null;clearInterval(t);$('#app').innerHTML='';login()}}},1000)}
function shell(){const m=S.me;$('#app').innerHTML=`<aside id="sb"><div class="logo">Sync MM2</div><div class="uc"><img class="av" src="${m.avatar}" alt=""><div><b>${m.name}</b><span class="tok" id="sbt"></span></div></div><div id="nv">${NAV.filter(n=>n[0]!=='admin'||m.admin).map(n=>`<button id="t_${n[0]}" onclick="go('${n[0]}')"><span>${n[1]}</span>${n[2]}</button>`).join('')}</div></aside><div id="ov" onclick="sb(0)"></div><div id="mn"><div class="top"><button class="s mb" onclick="sb(1)">☰</button><b id="tt"></b><span class="tok" id="hd"></span></div><main id="view"></main></div><button id="chatbtn" onclick="chatToggle()">💬</button><div id="chatpanel"></div>`;go(tab)}
const sb=o=>{$('#sb').classList.toggle('open',!!o);$('#ov').classList.toggle('show',!!o)};
function head(){const t=cfg.hide?'••••':fmt(S.me.tokens);if($('#hd'))$('#hd').textContent='🪙 '+t;if($('#sbt'))$('#sbt').textContent='🪙 '+t}
function go(t){tab=t;sel={};q='';sb(0);const n=NAV.find(x=>x[0]===t);document.querySelectorAll('#nv button').forEach(b=>b.classList.toggle('on',b.id==='t_'+t));$('#tt').textContent=n[2];const my=++nav;
 $('#view').innerHTML=`<div class="ld"><div class="sp"></div><span class="muted">Loading ${n[2]}…</span></div>`;
 setTimeout(async()=>{if(my!==nav)return;await load();if(my===nav)render()},cfg.anim?550:0)}
const render=()=>{({home:rHome,values:rValues,inventory:rInv,exchange:rEx,jackpot:rJP,mines:rMines,withdraw:rWd,deposit:rDep,leaderboard:rLb,settings:rSet,admin:rAdm})[tab]($('#view'))};
function srch(f){return`<input placeholder="Search items…" value="${q}" oninput="q=this.value;${f}()" style="width:100%;margin-bottom:12px">`}
const filt=l=>l.filter(i=>i.name.toLowerCase().includes(q.toLowerCase()));
function rValues(v){v.innerHTML=`<div class="box"><h3>Values of Items</h3>${srch('vl')}<div class="grid" id="g"></div></div>`;vl()}
function vl(){$('#g').innerHTML=filt([...S.items].sort((a,b)=>b.value-a.value)).map(i=>card(i)).join('')}
function rHome(v){const on=S.online||[],am=S.activeMines||[],j=S.jp;
 v.innerHTML=`<div class="box"><h3>🟢 Online now <span class="muted">(${on.length})</span></h3><div class="grid">${on.map(u=>`<div class="card"><div class="ic"><img class="av" style="width:40px;height:40px" src="${u.avatar}" alt=""></div><b>${u.name}</b></div>`).join('')||'<p class="muted">Just you.</p>'}</div></div>
<div class="box"><h3>🎲 Active games</h3><div class="stat"><span>🎰 Jackpot</span><b>${j.players.length?fmt(j.total)+' value · '+j.players.length+' players':'No one playing'}</b></div>
${am.length?am.map(x=>`<div class="stat"><span><img class="av" src="${x.avatar}" alt="">${x.name} — Mines</span><b>${x.open}/${25-x.m} tiles · bet ${fmt(x.bet)}🪙</b></div>`).join(''):'<div class="stat"><span>💣 Mines</span><b class="muted">No one playing</b></div>'}</div>`}
const owned=()=>S.items.filter(i=>S.me.inv[i.id]).map(i=>({...i,q:S.me.inv[i.id]}));
function pick(id){sel[id]=(sel[id]||0)+1;if(sel[id]>(S.me.inv[id]||0))delete sel[id];render()}
const selCard=i=>card(i,`<small class="muted"> ${sel[i.id]?sel[i.id]+'/':'x'}${i.q}</small>`,sel[i.id]?'sel':'',`onclick="pick('${i.id}')"`);
const selVal=()=>Object.entries(sel).reduce((s,[k,n])=>s+byId(k).value*n,0);
function rInv(v){v.innerHTML=`<div class="box"><h3>Inventory</h3><div class="stat"><span>Total item value</span><b>${fmt(S.me.invValue)}</b></div><div class="stat"><span>Tokens</span><b class="tok">${fmt(S.me.tokens)}</b></div></div><div class="grid">${owned().map(i=>card(i,` <small class="muted">x${i.q}</small>`)).join('')||'<p class="muted">Empty.</p>'}</div>`}
function rEx(v){v.innerHTML=`<div class="box"><h3>Sell items <span class="muted">— 90% in tokens</span></h3><div class="grid">${owned().map(i=>card(i,`<small class="muted"> x${i.q} · ${fmt(i.value*.9)}🪙</small><button style="width:100%;margin-top:6px" onclick="sell('${i.id}')">Sell 1</button>`)).join('')||'<p class="muted">Nothing to sell.</p>'}</div></div>
<div class="box"><h3>Shop <span class="muted">— 110%</span></h3><div class="grid">${S.items.filter(i=>S.shop[i.id]).map(i=>card(i,`<small class="muted"> stock ${S.shop[i.id]} · ${fmt(Math.ceil(i.value*1.1))}🪙</small><button style="width:100%;margin-top:6px" onclick="buy('${i.id}')">Buy 1</button>`)).join('')||'<p class="muted">Shop is empty.</p>'}</div></div>`}
async function sell(id){await api('sell',{item:id,qty:1});await load();if(tab==='exchange')render()}async function buy(id){await api('buy',{item:id,qty:1});await load();if(tab==='exchange')render()}
function rJP(v){v.innerHTML=`<div class="box"><h3>Jackpot <span class="muted">— items only · 10% tax</span></h3><div class="ptr"></div><div id="wheel"></div><p id="jt" style="text-align:center"></p><div id="jr" style="text-align:center;font-weight:700"></div><div id="jl"></div></div>
<div class="box"><h3>Select items to join</h3><p>Selected value: <b>${fmt(selVal())}</b></p><div class="grid">${owned().map(selCard).join('')}</div><div class="row"><button onclick="jpj()">Join jackpot</button><button class="s" onclick="jpl()">Leave (if alone)</button></div></div>`;wheelSig='';jpUpdate()}
async function jpj(){if((await api('jpjoin',{items:sel})).ok)sel={};await load();if(tab==='jackpot')render()}async function jpl(){await api('jpleave');await load();if(tab==='jackpot')render()}
let wheelSig='',spinning=false;
function jpUpdate(){const j=S.jp,w=$('#wheel');if(!w)return;const sig=j.players.map(p=>p.id+p.value).join();
 if(sig!==wheelSig){wheelSig=sig;let a=0;const st=j.players.map(p=>{const s=`${hue(p.id)} ${a}% ${a+p.pct}%`;a+=p.pct;return s});
  if(!spinning)w.style.background=st.length?`conic-gradient(${st.join(',')})`:'var(--p2)';
  $('#jl').innerHTML=`<table>${j.players.map(p=>`<tr><td><img class="av" src="${p.avatar}" alt=""><span style="color:${hue(p.id)}">${p.name}</span></td><td>${fmt(p.value)}</td><td>${p.pct.toFixed(1)}%</td></tr>`).join('')}</table>`}
 const left=j.end?Math.max(0,Math.ceil((j.end-j.now)/1000)):0;$('#jt').textContent=j.players.length<2?'Waiting for 2+ players…':`Spinning in ${left}s · Pot ${fmt(j.total)}`;
 const l=j.last;if(l&&l.rid!==seen){const fresh=(j.now-l.t)<12000;seen=l.rid;if(fresh)spin(l)}}
function spin(l){const w=$('#wheel');if(!w)return;spinning=true;let a=0,c=0;const t=l.snap.reduce((s,p)=>s+p.value,0);
 const st=l.snap.map(p=>{const pc=p.value/t*100;if(p.id===l.winner)c=(a+pc/2)*3.6;const s=`${hue(p.id)} ${a}% ${a+pc}%`;a+=pc;return s});
 w.style.transition='none';w.style.transform='rotate(0)';w.style.background=`conic-gradient(${st.join(',')})`;w.offsetWidth;
 w.style.transition=cfg.anim?'transform 5s cubic-bezier(.12,.7,.1,1)':'none';w.style.transform=`rotate(${360*6-c}deg)`;
 setTimeout(()=>{const r=$('#jr');if(r)r.innerHTML=`🏆 ${l.name} won ${fmt(l.total-l.taxed)} value! <span class="muted">(tax ${fmt(l.taxed)})</span>`;spinning=false;wheelSig='';load()},cfg.anim?5200:0)}
const rr=()=>{if(tab==='mines')rMines($('#view'))};
function rMines(v){const g=S.mines,r=mres,n=g?g.open.length:0,m=g?g.m:mmn,cur=g?g.mult:1;
 const setup=g?`<div class="stat"><span>Bet</span><b>${fmt(g.bet)} 🪙</b></div><div class="stat"><span>Mines</span><b>${g.m}</b></div><div class="stat"><span>Multiplier</span><b class="g">${cur.toFixed(2)}x</b></div><div class="stat"><span>Payout</span><b class="g">${fmt(g.bet*cur)} 🪙</b></div><div class="stat"><span>Next tile</span><b>${mlt(m,n+1).toFixed(2)}x</b></div><button class="big" onclick="mca()" ${n?'':'disabled'}>Cash out ${fmt(g.bet*cur)} 🪙</button>`
 :`<label class="lb">Bet amount (tokens)</label><div class="row"><input id="mb" type="number" min="1" value="${mbet}" oninput="mbet=+this.value" style="flex:1;min-width:90px"><button class="s" onclick="mset(.5)">½</button><button class="s" onclick="mset(2)">2×</button><button class="s" onclick="mset(0)">Max</button></div>
 <div class="row">${[10,50,100,500,1000].map(x=>`<button class="s" onclick="mbet=${x};rr()">${x}</button>`).join('')}</div>
 <label class="lb">Mines: <b id="mc" style="color:var(--t)">${mmn}</b></label><input type="range" min="1" max="10" value="${mmn}" oninput="mmn=+this.value;$('#mc').textContent=mmn;$('#pv').textContent=mlt(mmn,1).toFixed(2)+'x'" style="width:100%">
 <div class="row">${[1,3,5,10].map(x=>`<button class="s" onclick="mmn=${x};rr()">${x}</button>`).join('')}</div>
 <div class="stat"><span>First tile pays</span><b class="g" id="pv">${mlt(mmn,1).toFixed(2)}x</b></div><div class="stat"><span>Your balance</span><b class="tok">${fmt(S.me.tokens)}</b></div><button class="big" onclick="mst()" ${mbusy?'disabled':''}>${mbusy?'Placing mines…':'Start game'}</button>`;
 const tiles=Array.from({length:25},(_,i)=>{const o=(g?g.open:r?r.open:[]).includes(i),b=!g&&r&&r.mines&&r.mines.includes(i);return`<button class="${o?'ok':b?'bm'+(i===mlast&&r.boom?' hit':''):''}" ${g&&!o&&!mbusy?`onclick="mp(${i})"`:'disabled'}>${o?'💎':b?'💣':''}</button>`}).join('');
 const msg=!g&&r?(r.boom?'<p style="text-align:center;color:var(--r);font-weight:700">💥 Boom! You lost your bet.</p>':`<p style="text-align:center;color:var(--g);font-weight:700">✅ Cashed out ${fmt(r.cashed)} 🪙</p>`):'';
 v.innerHTML=`<div class="mw"><div class="box"><h3>💣 Mines <span class="muted">— tokens only</span></h3>${setup}</div><div class="box"><div class="mg ${mbusy?'pls':''}">${tiles}</div>${msg}</div></div>`}
function mset(x){mbet=x?Math.max(1,Math.floor(mbet*x)):Math.max(1,Math.floor(S.me.tokens));rr()}
async function mst(){if(mbusy)return;mres=null;mbusy=true;rr();await new Promise(r=>setTimeout(r,cfg.anim?700:0));await api('minesstart',{bet:mbet,m:mmn});mbusy=false;await load();rr()}
async function mp(i){mlast=i;const r=await api('minespick',{i});if(r.boom)mres=r;else if(r.cashed!=null)mres=r;await load();rr()}
async function mca(){const r=await api('minescash');if(r.cashed!=null)mres=r;await load();rr()}
function rWd(v){const wl=owned().filter(i=>['gun','knife'].includes(i.type));v.innerHTML=`<div class="box"><h3>Withdraw <span class="muted">— guns &amp; knives only</span></h3><div class="grid">${wl.map(i=>card(i,`<small class="muted"> x${i.q}</small><button style="width:100%;margin-top:6px" onclick="wd('${i.id}')">Request 1</button>`)).join('')||'<p class="muted">No withdrawable items.</p>'}</div></div>
<div class="box"><h3>Your requests</h3><table>${S.wd.map(w=>`<tr><td>${w.qty}x ${byId(w.item).name}</td><td>${w.status}</td></tr>`).join('')||'<tr><td class="muted">None yet</td></tr>'}</table></div>`}
async function wd(id){await api('withdraw',{item:id,qty:1});toast('Request sent');await load();if(tab==='withdraw')render()}
function rDep(v){v.innerHTML=`<div class="box"><h3>Deposit</h3><p>Join the Discord and open a ticket to deposit manually.</p><a href="https://discord.gg/AFyru7hAnn" target="_blank" rel="noopener"><button class="big">Join Discord</button></a></div>`}
async function rLb(v){const d=await api('lb');const t=(n,l)=>`<div class="box"><h3>${n}</h3><table>${l.map((u,i)=>`<tr><td>${i+1}</td><td><img class="av" src="${u.avatar}" alt="">${u.name}</td><td style="color:${u.v<0?'var(--r)':'var(--g)'}">${fmt(u.v)}</td></tr>`).join('')||'<tr><td class="muted">No data</td></tr>'}</table></div>`;v.innerHTML=t('Top Wagered',d.wagered||[])+t('Top Profit',d.profit||[])}
function rSet(v){v.innerHTML=`<div class="box"><h3>Settings</h3><p><label><input type="checkbox" ${cfg.anim?'checked':''} onchange="sc('anim',this.checked)"> Animations</label></p><p><label><input type="checkbox" ${cfg.hide?'checked':''} onchange="sc('hide',this.checked)"> Hide token balance</label></p><p class="muted">Your Roblox ID: <b style="color:var(--t)">${S.me.id}</b><br>Admin access: add this ID to ADMIN_IDS in Vercel.</p><button class="s" onclick="api('logout').then(()=>location.reload())">Log out</button></div>`}
function sc(k,x){cfg[k]=x;localStorage.cfg=JSON.stringify(cfg);document.body.className=cfg.anim?'':'noanim';head()}
function rAdm(v){const A=S.admin||{wd:[],logs:[],alts:[]},opts=S.items.map(i=>'<option value="'+i.id+'">'+i.name+'</option>').join('');
 const wl=A.wd.map(w=>'<tr><td>'+w.name+'</td><td>'+w.qty+'x '+byId(w.item).name+'</td><td><button data-a="admwd" data-id="'+w.id+'" data-ok="1">Approve</button> <button class="s" data-a="admwd" data-id="'+w.id+'" data-ok="0">Reject</button></td></tr>').join('')||'<tr><td class="muted">None pending</td></tr>';
 v.innerHTML='<div class="box"><h3>Items and tokens</h3><div class="row"><input id="au" placeholder="Username or ID"><select id="ai">'+opts+'</select><input id="aq" type="number" placeholder="Qty / amount / value" style="width:160px"></div>'
 +'<div class="row"><button data-a="admgive">Give item</button><button data-a="admset">Set qty</button><button data-a="admtokens">Add tokens</button><button data-a="admvalue">Set item value</button></div></div>'
 +'<div class="box"><h3>Games</h3><div class="row"><button data-a="admcanceljp">Cancel jackpot</button><button data-a="admcancelmines">Cancel users mines</button></div></div>'
 +'<div class="box"><h3>Withdrawals</h3><table>'+wl+'</table></div>'
 +'<div class="box"><h3>Possible alt accounts <span class="muted">— same device</span></h3><table>'+((A.alts&&A.alts.length)?A.alts.map(g=>'<tr><td>'+g.join(', ')+'</td></tr>').join(''):'<tr><td class="muted">None detected</td></tr>')+'</table></div>'
 +'<div class="box"><h3>Discord webhook '+(A.webhook?'(set)':'(not set)')+'</h3><div class="row"><input id="aw" placeholder="Webhook URL" style="flex:1"><button data-a="admwebhook">Save</button></div></div>';
 v.onclick=e=>{const b=e.target.closest('button[data-a]');if(!b)return;const a=b.dataset.a;
  if(a==='admcanceljp')api(a).then(load);else if(a==='admwd')aw(b.dataset.id,+b.dataset.ok);
  else if(a==='admwebhook')api(a,{url:$('#aw').value}).then(()=>toast('Saved'));else ad(a)}}
async function ad(a){const b={user:$('#au').value,item:$('#ai').value,qty:$('#aq').value,amount:$('#aq').value,value:$('#aq').value};if((await api(a,b)).ok)toast('Done');await load()}
async function aw(id,ok){await api('admwd',{id,ok});await load();if(tab==='admin')render()}
function chatToggle(){chatOpen=!chatOpen;const p=$('#chatpanel'),b=$('#chatbtn');if(!p)return;p.classList.toggle('open',chatOpen);if(chatOpen){if(b)b.classList.remove('alert');chatRender()}}
function chatRender(){const p=$('#chatpanel');if(!p)return;const c=S.chat||[];chatSeen=c.length;
 p.innerHTML=`<div style="padding:10px 12px;border-bottom:1px solid var(--ln);font-weight:700">Site chat</div><div id="chatmsgs">${c.map(m=>`<div class="cmsg"><b>${m.name}:</b> ${m.msg.replace(/</g,'&lt;')}</div>`).join('')||'<p class="muted">No messages yet.</p>'}</div><div id="chatin"><input id="cmi" placeholder="Message…" onkeydown="if(event.key==='Enter')chatSend()"><button onclick="chatSend()">Send</button></div>`;
 const box=$('#chatmsgs');if(box)box.scrollTop=box.scrollHeight}
async function chatSend(){const i=$('#cmi');if(!i||!i.value.trim())return;i.disabled=true;await api('chatsend',{msg:i.value});i.value='';await load();if(chatOpen)chatRender();const ni=$('#cmi');if(ni)ni.focus()}
function chatTick(){const c=S.chat||[],btn=$('#chatbtn');if(!btn)return;if(chatOpen)chatRender();else if(c.length>chatSeen)btn.classList.add('alert')}
load();
</script></body></html>
